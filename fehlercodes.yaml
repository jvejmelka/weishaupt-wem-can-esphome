# Warn- und Fehlercodes Weishaupt WTC-GW 15 … 32-B mit WEM – EIGENE Kurztexte (DE/EN)
#
# Herkunft: Die Nummern und ihre Bedeutung stammen aus der Montage- und Betriebsanleitung
# "Gas-Brennwertgerät WTC-GW 15 … 32-B", Kapitel 10 (Warncode 10.2, Fehlercode 10.3):
#   Deutsch  83307201 (1/2025-01): https://www.weishaupt.de/uploads/tx_weishaupt_documents/documents/83307201.pdf
#   Englisch 83307202 (2/2018-05): https://www.weishaupt.de/uploads/tx_weishaupt_documents/documents/83307202.pdf
#
# Urheberrecht: Die Texte der Anleitung sind geschützt (Rechte bei Max Weishaupt SE). Deshalb stehen hier
# KEINE Originaltexte, sondern eigene, kurze Beschreibungen der Ursache. Was zu tun ist (Behebung), steht nur
# in der Anleitung – bitte dort nachlesen; die meisten Punkte darf nur eine Fachkraft beheben.
# Wer die Originalwortlaute angezeigt haben möchte: Anleitung selbst herunterladen und
#   python3 werkzeuge/fehlertexte_aus_handbuch.py --header 83307201.pdf
# ausführen (erzeugt lokale Dateien, die nicht ins Repo gehören; siehe PROTOKOLL.md, Abschnitt 10c).
#
# Aufbau: typ W = Warnung, F = Fehler (Störung); nr = Nummer; bis = letzte Nummer eines Bereichs
# (Kommunikationswarnungen: die letzten beiden Stellen sind die Nummer des Teilnehmers);
# modul = nur bei Nummern, die je nach Modul etwas anderes bedeuten (WTC = Brennwertgerät/Feuerungsautomat,
# EM-HK = Erweiterungsmodul Heizkreis, EM-SOL = Solar, EM-WW = Warmwasser, KASKADE = Kaskadenregler).

