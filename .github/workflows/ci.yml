name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests der Regellogik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests bauen und ausfuehren
        run: tests/run.sh

  register:
    name: Registertabelle und erzeugte Dateien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PyYAML installieren
        run: pip install pyyaml
      - name: Erzeugen und pruefen, dass nichts veraltet ist
        # register.yaml ist die einzige Quelle; pakete/register_gen.h und die Tabellen in
        # PROTOKOLL.md/README.md muessen dazu passen (sonst: Generator lokal laufen lassen)
        run: |
          python3 werkzeuge/register_erzeugen.py
          git diff --exit-code

  links:
    name: Links in den .md-Dateien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Relative Links und Anker pruefen
        run: python3 tests/links.py

  firmware:
    name: Firmware kompilieren (ESPHome 2026.9.0)
    runs-on: ubuntu-latest
    env:
      ESPHOME_VERSION: "2026.9.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache PlatformIO und ESPHome-Build
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ hashFiles('weishaupt-wem-can.yaml', 'pakete/**', 'register.yaml') }}
          restore-keys: esphome-${{ env.ESPHOME_VERSION }}-
      - name: ESPHome installieren
        run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Dummy-secrets.yaml aus der Vorlage
        # nur Platzhalter (Dokumentationsadressen 192.0.2.x) - echte Zugangsdaten gibt es hier nicht
        run: cp secrets.yaml.example secrets.yaml
      - name: Kompilieren
        run: esphome compile weishaupt-wem-can.yaml
