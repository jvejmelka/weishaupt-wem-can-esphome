# Objekte aus anderen Projekten - uebernommen, an der eigenen Anlage NICHT geprueft.
#
# Hier stehen nur Tatsachen ueber das Protokoll (Objektnummer, Skalierung, Einheit, Bedeutung) mit
# eigenen Bezeichnungen und der Quelle je Objekt. Kein Code und keine Tabellen oder Texte aus den
# Quellen. Daraus erzeugt werkzeuge/register_erzeugen.py die Tabellen im Abschnitt
# "Uebernommene Objekte" von PROTOKOLL.md und PROTOKOLL.en.md.
#
# Sobald ein Objekt an der Anlage gelesen und verglichen ist, wandert es mit Beleg nach
# register.yaml und wird hier geloescht (der Generator meldet doppelte Eintraege als Fehler).
#
# Felder je Objekt:
#   index, sub        CAN-Objekt am Knoten der Gruppe. Bei Quellen mit JSON-Adresse ist der Index mit
#                     den Versaetzen aus PROTOKOLL.md ("Abbildung JSON-Objekt -> CAN-Objekt") umgerechnet.
#   name, name_en     eigene Bezeichnung (deutsch, englisch)
#   faktor, einheit   Skalierung des Rohwerts; ohne faktor ist der Wert ein Code oder Zaehler
#   werte, werte_en   stattdessen: Text fuer die Spalte Skalierung (z. B. "Code")
#   json              Adresse an der JSON-Schnittstelle "MI MX OX OS", wenn die Quelle sie nennt
#   modbus            Register am WEM-Modbus-Gateway, wenn die Quelle es nennt
#   quelle            Liste von Kuerzeln aus "quellen"
#   hinweis, hinweis_en   optional

quellen:
  geronet1:
    kurz: geronet1
    name: "geronet1/wem-python"
    url: "https://github.com/geronet1/wem-python"
    was: "Objektliste des Mitschnitts (`wem_codes.py`)"
    was_en: "object list of the bus logger (`wem_codes.py`)"
  borg:
    kurz: BorgNumberOne
    name: "BorgNumberOne/Weishaupt_CanApiJson"
    url: "https://github.com/BorgNumberOne/Weishaupt_CanApiJson"
    was: "Adresstabelle der JSON-Schnittstelle mit Modbus-Registern"
    was_en: "address table of the JSON interface with Modbus registers"
  kraiz:
    kurz: kraiz
    name: "kraiz/hassio-weishaupt"
    url: "https://github.com/kraiz/hassio-weishaupt"
    was: "Sensorliste der Home-Assistant-Integration (MIT-Lizenz)"
    was_en: "sensor list of the Home Assistant integration (MIT licence)"
  komenda:
    kurz: ChristophKomenda
    name: "BorgNumberOne/Weishaupt_CanApiJson, Pull Request #10 (ChristophKomenda)"
    url: "https://github.com/BorgNumberOne/Weishaupt_CanApiJson/pull/10"
    was: "Heizkreis-Parameter der JSON-Schnittstelle"
    was_en: "heating circuit parameters of the JSON interface"

