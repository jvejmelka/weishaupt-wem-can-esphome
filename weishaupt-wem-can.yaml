# Weishaupt WTC-GW (WEM-Systemgeraet) am CAN-Bus - ESPHome-Firmware
# Board: WeAct CAN485 DevBoard V1 (ESP32-D0WD-V3, 2,5 kV isolierter CAN-Transceiver)
#
#   CAN TX = GPIO27   CAN RX = GPIO26   50 kbps
#   120-Ohm-Terminierung auf dem Board AUS lassen - das Board haengt MITTEN am Bus.
#
# Diese Datei waehlt nur die Pakete aus. Alles Persoenliche steht in secrets.yaml
# (Vorlage: secrets.yaml.example). Nicht benoetigte Pakete auskommentieren.
#
#   pakete/kessel.yaml               Pflicht: Kesselwerte lesen, Diagnose, WLAN-Felder
#   pakete/warmwasser.yaml           Warmwasserwerte (nur mit Warmwasserspeicher am WTC)
#   pakete/mqtt.yaml                 Werte und Befehle ueber MQTT
#   pakete/homeassistant-api.yaml    native Home-Assistant-API (statt oder neben MQTT)
#   pakete/wem-schalten.yaml         Heizkreis-Betriebsart ueber die WEM-JSON-Schnittstelle
#   pakete/warmwasser-schalten.yaml  Warmwasser Ein/Aus ueber WEM (braucht wem-schalten)
#   pakete/feste-ip.yaml             feste IP statt DHCP (Empfehlung: DHCP + Router-Reservierung)
#
substitutions:
  geraet: weact-can485-weishaupt       # Geraetename = MQTT-Praefix
  anzeigename: Weishaupt WTC-GW 15-B
  firmware: "v14 vom 27.09.2026"

packages:
  kessel: !include pakete/kessel.yaml
  warmwasser: !include pakete/warmwasser.yaml
  mqtt: !include pakete/mqtt.yaml
  # api: !include pakete/homeassistant-api.yaml
  schalten: !include pakete/wem-schalten.yaml
  warmwasser_schalten: !include pakete/warmwasser-schalten.yaml
  # feste_ip: !include pakete/feste-ip.yaml

esphome:
  name: ${geraet}
  friendly_name: ${anzeigename}
  project:
    name: "jvejmelka.weishaupt-wem-can"
    version: "14"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    mqtt: NONE
    mqtt.client: NONE
    mqtt.component: NONE
    canbus: ERROR

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Findet OTA das Board nicht per mDNS: "esphome upload ... --device <IP>" nutzen
  # oder hier  use_address: <IP>  eintragen.
  ap:                                  # Notfall-Hotspot, wenn das WLAN nicht erreichbar ist
    ssid: "Weishaupt-WEM-CAN"
    password: !secret ap_password

captive_portal:

# Weboberflaeche: http://<IP des Boards>, Benutzer admin.
#   local: true bettet JS/CSS ein - die Seite funktioniert ohne Internet.
#   Basic Auth laeuft unverschluesselt ueber HTTP: nur im LAN betreiben.
web_server:
  port: 80
  version: 3
  local: true
  auth:
    username: admin
    password: !secret web_password

time:
  - platform: sntp
    id: uhr
    timezone: Europe/Berlin
    servers: [0.pool.ntp.org, 1.pool.ntp.org]
