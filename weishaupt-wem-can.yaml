# --- Aktiver Kessel-Poller (2026-09-26) wie MenkeC: fragt Knoten 2 (Kessel, 0x602)
#   im 20-s-Takt selbst ab -> Brenner/Leistung/Drehzahl/Vorlauf-Soll/Abgas/Druck/
#   Volumenstrom/Kesseltemp sind damit WEM-UNABHAENGIG, auch bei totem WEM.
#   Direkte CAN-SDO-Reads gehen am fragilen WEM-HTTP-Uebersetzer vorbei (kein Slot-Bug,
#   nicht vorhandene Objekte geben nur einen normalen Abort). 150 ms Abstand je Anfrage.
#   Knoten 1 (Systemgeraet): nur zwei Leseobjekte, 0x274D (Statusbits) und 0x2640/3
#   (Vorlaufsoll-Anforderung). Die WW-Betriebsart selbst liegt NICHT im Bereich
#   0x2500-0x28FF (Objektscan A-D, 2026-09-26). Auf Knoten 2 wird nie geschrieben.
interval:
  # Bus-off-Waechter (2026-09-26): startet der ESP, waehrend die Heizung aus ist,
  # geht der CAN-Controller nach unbeantworteten Abfragen in Bus-off und liest
  # danach nie wieder. Kommt 5 min lang kein einziger Frame, Neustart.
  - interval: 60s
    then:
      - lambda: |-
          uint32_t jetzt = millis();
          float m = id(waechter_min).state;
          if (isnan(m) || m <= 0) return;            // 0 = Waechter aus
          uint32_t grenze = (uint32_t) (m * 60000.0f);
          if (jetzt > grenze && jetzt - id(letzter_frame) > grenze) {
            ESP_LOGW("waechter", "%.0f min kein CAN-Frame - Neustart", m);
            App.safe_reboot();
          }
  - interval: 25ms
    then:
      - lambda: |-
          if (!id(scan_aktiv)) return;
          if (millis() - id(letzter_frame) > 30000) return;   // Bus tot: nicht senden
          int idx = id(scan_idx), sub = id(scan_sub);
          std::vector<uint8_t> d = {0x40, (uint8_t)(idx & 0xFF), (uint8_t)(idx >> 8), (uint8_t)sub, 0, 0, 0, 0};
          id(my_can_bus)->send_data(0x600 + id(scan_knoten), false, d);
          if (++sub > id(scan_maxsub)) { sub = 0; idx++; }
          if (idx > id(scan_ende)) { id(scan_aktiv) = false; ESP_LOGI("scan", "Objektscan fertig"); }
          id(scan_idx) = idx; id(scan_sub) = sub;
  # Knoten 1, Einstellungen/Zustaende von Heizkreis (JSON MI02 +0x400) und
  # Warmwasser (JSON MI03 +0x500), gefunden per Differenzscan 2026-09-26. NUR LESEN.
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return millis() - id(letzter_frame) < 30000;'
          then:
            - canbus.send:
                canbus_id: my_can_bus
                can_id: 0x601
                data: [0x40, 0x33, 0x29, 0x02, 0x00, 0x00, 0x00, 0x00]
            - delay: 150ms
            - canbus.send:
                canbus_id: my_can_bus
                can_id: 0x601
                data: [0x40, 0x20, 0x2A, 0x02, 0x00, 0x00, 0x00, 0x00]
            - delay: 150ms
            - canbus.send:
                canbus_id: my_can_bus
                can_id: 0x601
                data: [0x40, 0x58, 0x29, 0x02, 0x00, 0x00, 0x00, 0x00]
            - delay: 150ms
            - canbus.send:
                canbus_id: my_can_bus
                can_id: 0x601
                data: [0x40, 0x2C, 0x2A, 0x02, 0x00, 0x00, 0x00, 0x00]
            - delay: 150ms
            - canbus.send:
                canbus_id: my_can_bus
                can_id: 0x601
                data: [0x40, 0x39, 0x2A, 0x02, 0x00, 0x00, 0x00, 0x00]
            - delay: 150ms
            - canbus.send:
                canbus_id: my_can_bus
                can_id: 0x601
                data: [0x40, 0x07, 0x29, 0x02, 0x00, 0x00, 0x00, 0x00]
            - delay: 150ms
  - interval: 20s
    then:
      # Nur senden, wenn der Bus lebt (letzter Frame < 30 s). Sonst gehen die
      # Abfragen bei ausgeschalteter Heizung ins Leere und der Controller in Bus-off.
      - if:
          condition:
            lambda: 'return millis() - id(letzter_frame) < 30000;'
          then:
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x602
              data: [0x40, 0x32, 0x25, 0x00, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x602
              data: [0x40, 0x37, 0x25, 0x00, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x602
              data: [0x40, 0x34, 0x25, 0x00, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x602
              data: [0x40, 0x40, 0x25, 0x00, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x602
              data: [0x40, 0x45, 0x25, 0x00, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x602
              data: [0x40, 0x41, 0x25, 0x00, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x602
              data: [0x40, 0x13, 0x27, 0x02, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x602
              data: [0x40, 0x14, 0x27, 0x02, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms
          # Knoten 1: Betriebsart Heizkreis 0x274D NUR LESEN (0x40), Freigabe Betreiber 2026-09-26
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x601
              data: [0x40, 0x4D, 0x27, 0x00, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms
          # Knoten 1: Vorlaufsoll-Anforderung an den Kessel 0x2640/3 NUR LESEN
          #   Scans A-D 2026-09-26: 50,0 bei WW Ein (35 + 15 K), 23,0 bei WW Aus (Heizkurve)
          - canbus.send:
              canbus_id: my_can_bus
              can_id: 0x601
              data: [0x40, 0x40, 0x26, 0x03, 0x00, 0x00, 0x00, 0x00]
          - delay: 150ms


script:
  - id: wem_senden
    mode: single
    parameters:
      vg: string
    then:
      - lambda: 'id(schalt_status).publish_state("sende an WEM ...");'
      - http_request.post:
          url: !lambda 'return "http://" + id(wem_ip).state + "/ajax/CanApiJson.json";'
          request_headers:
            Authorization: !lambda |-
              // Header erwartet const char* - Puffer muss die Anfrage ueberleben, daher static
              static std::string h;
              std::string up = id(wem_user).state + ":" + id(wem_pass).state;
              h = "Basic " + esphome::base64_encode((const uint8_t *) up.data(), up.size());
              return h.c_str();
            Referer: !lambda |-
              static std::string r;
              r = "http://" + id(wem_ip).state + "/";
              return r.c_str();
            Content-Type: "application/json"
          body: !lambda |-
            return std::string("{\"ID\":\"") + to_string(millis() % 100000000) +
                   "\",\"SRC\":\"DDC\",\"CAPI\":{\"NN\":1,\"N01\":{\"VG\":\"" + vg + "\"}}}";
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            then:
              - lambda: |-
                  bool ok = response->status_code == 200 && body.find("\"VG\":\"04") != std::string::npos;
                  if (!ok) { id(wem_fehler) += 1; id(wem_fehler_sensor).publish_state(id(wem_fehler)); }
                  if (id(schalt_ziel) == 3) {
                    size_t p = body.find("\"VG\":\"");
                    std::string vg = p == std::string::npos ? std::string("?") : body.substr(p + 6, body.find('"', p + 6) - p - 6);
                    std::string cm = vg.substr(0, 2);
                    std::string t = cm == "04" ? "OK, WEM bestaetigt (VG " + vg + ")" :
                                    cm == "05" ? "abgelehnt (CM=05): Objekt unbekannt oder nicht schreibbar - VG " + vg :
                                    "Antwort HTTP " + to_string(response->status_code) + ", VG " + vg;
                    id(schreib_antwort).publish_state(t);
                    id(schalt_status).publish_state("Schreibbefehl: " + t);
                    id(schalt_ziel) = 0;
                    return;
                  }
                  id(schalt_status).publish_state(ok ? "WEM hat bestaetigt, pruefe am Bus ..." : ("WEM-Antwort unklar (HTTP " + to_string(response->status_code) + "), pruefe am Bus ..."));
          on_error:
            then:
              - lambda: |-
                  id(wem_fehler) += 1; id(wem_fehler_sensor).publish_state(id(wem_fehler));
                  if (id(schalt_ziel) == 3) { id(schreib_antwort).publish_state("WEM nicht erreichbar"); id(schalt_ziel) = 0; return; }
                  id(schalt_status).publish_state("WEM nicht erreichbar, pruefe am Bus ...");
      # Unabhaengig von der WEM-Antwort: der Bus entscheidet (am 26.09. schaltete die Heizung
      # auch bei leerer WEM-Antwort). Nach 3 s das Zielobjekt lesen.
      - delay: 3s
      - lambda: |-
          if (id(schalt_ziel) != 1 && id(schalt_ziel) != 2) return;
          uint16_t idx = id(schalt_ziel) == 1 ? 0x2933 : 0x2A20;
          std::vector<uint8_t> d = {0x40, (uint8_t)(idx & 0xFF), (uint8_t)(idx >> 8), 0x02, 0, 0, 0, 0};
          id(my_can_bus)->send_data(0x601, false, d);

button:
  - platform: restart
    name: "Neustart ESP"
    web_server:
      sorting_group_id: g_diag
      sorting_weight: 10
  - platform: template
    name: "Schreiben"
    web_server:
      sorting_group_id: g_schreiben
      sorting_weight: 2
    on_press:
      - if:
          condition:
            lambda: 'return id(letzter_befehl) != 0 && millis() - id(letzter_befehl) < 60000;'
          then:
            - lambda: 'id(schreib_antwort).publish_state("bitte warten - hoechstens ein Befehl pro Minute");'
          else:
            - lambda: |-
                // Format: MI MX OX OS WERT (hex), z.B. "03 00 2520 02 02" = Warmwasser Aus
                unsigned mi = 0, mx = 0, ox = 0, os = 0; char w[12] = {0};
                id(schalt_ziel) = 0;
                if (sscanf(id(schreib_eingabe).state.c_str(), "%x %x %x %x %10s", &mi, &mx, &ox, &os, w) != 5 ||
                    mx > 0xFF || ox > 0xFFFF || os > 0xFF) {
                  id(schreib_antwort).publish_state("ungueltig - Format: MI MX OX OS WERT, z.B. 03 00 2520 02 02"); return;
                }
                // Sperre: nur Systemgeraet-Module SYSTEM0 (01), HZK0 (02), WW0 (03). Kessel (07/09/0a) nie.
                if (mi != 1 && mi != 2 && mi != 3) {
                  id(schreib_antwort).publish_state("gesperrt: nur MI 01, 02, 03 erlaubt - Kessel wird nie beschrieben"); return;
                }
                std::string v = w;
                bool hex = !v.empty() && v.size() <= 4 && v.find_first_not_of("0123456789abcdefABCDEF") == std::string::npos;
                if (!hex) { id(schreib_antwort).publish_state("Wert: 1-4 Hexziffern"); return; }
                if (v.size() % 2) v = "0" + v;
                char b[40];
                snprintf(b, sizeof(b), "03%02X%02X%04X%02X%04X%s", mi, mx, ox, os, (unsigned) (v.size() / 2), v.c_str());
                id(schreib_vg) = b;
                id(schalt_ziel) = 3; id(letzter_befehl) = millis();
                id(schreib_antwort).publish_state(std::string("sende VG ") + b + " ...");
            - if:
                condition:
                  lambda: 'return id(schalt_ziel) == 3;'
                then:
                  - script.execute:
                      id: wem_senden
                      vg: !lambda 'return id(schreib_vg);'
  - platform: template
    name: "Lesen"
    web_server:
      sorting_group_id: g_lesen
      sorting_weight: 2
    on_press:
      - lambda: |-
          std::string e = id(lese_eingabe).state;
          unsigned kn = 0, idx = 0, sub = 0;
          if (sscanf(e.c_str(), "%x %x %x", &kn, &idx, &sub) != 3 || kn < 1 || kn > 127 || idx > 0xFFFF || sub > 0xFF) {
            id(lese_antwort).publish_state("ungueltig - Format: 01 2933 02"); return;
          }
          if (millis() - id(letzter_frame) > 30000) { id(lese_antwort).publish_state("Bus tot - nicht gesendet"); return; }
          id(cmd_kn) = kn; id(cmd_idx) = idx; id(cmd_sub) = sub; id(cmd_aktiv) = true;
          id(lese_antwort).publish_state("gesendet, warte ...");
          std::vector<uint8_t> d = {0x40, (uint8_t)(idx & 0xFF), (uint8_t)(idx >> 8), (uint8_t)sub, 0, 0, 0, 0};
          id(my_can_bus)->send_data(0x600 + kn, false, d);

# Schalten (v8): ueber WEM-JSON, Kontrolle am Bus, hoechstens ein Befehl pro Minute.
select:
  - platform: template
    name: "Heizkreis Betriebsart setzen"
    id: hk_setzen
    options: ["Standby", "Zeitprogramm 1", "Zeitprogramm 2", "Zeitprogramm 3", "Sommer", "Komfort", "Normal", "Absenk"]
    optimistic: false
    web_server:
      sorting_group_id: g_schalten
      sorting_weight: 1
    set_action:
      - if:
          condition:
            lambda: 'return id(letzter_befehl) != 0 && millis() - id(letzter_befehl) < 60000;'
          then:
            - lambda: 'id(schalt_status).publish_state("bitte warten - hoechstens ein Befehl pro Minute");'
          else:
            - lambda: |-
                const auto &opts = id(hk_setzen).traits.get_options();
                int code = 0;
                for (size_t i = 0; i < opts.size(); i++) if (x == opts[i]) code = i + 1;
                id(schalt_ziel) = 1; id(schalt_wert) = code; id(letzter_befehl) = millis();
            - script.execute:
                id: wem_senden
                vg: !lambda 'char b[24]; snprintf(b, sizeof(b), "03020025330200010%X", id(schalt_wert)); return std::string(b);'
  - platform: template
    name: "Warmwasser setzen"
    id: ww_setzen
    options: ["Ein", "Aus"]
    optimistic: false
    web_server:
      sorting_group_id: g_schalten
      sorting_weight: 2
    set_action:
      - if:
          condition:
            lambda: 'return id(letzter_befehl) != 0 && millis() - id(letzter_befehl) < 60000;'
          then:
            - lambda: 'id(schalt_status).publish_state("bitte warten - hoechstens ein Befehl pro Minute");'
          else:
            - lambda: 'id(schalt_ziel) = 2; id(schalt_wert) = (x == "Ein") ? 1 : 2; id(letzter_befehl) = millis();'
            - script.execute:
                id: wem_senden
                vg: !lambda 'return std::string(id(schalt_wert) == 1 ? "030300252002000101" : "030300252002000102");'

number:
  - platform: template
    name: "Waechter: Neustart nach Minuten ohne Bus (0 = aus)"
