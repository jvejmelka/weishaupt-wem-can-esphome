# Eingabefeld auf der Weboberflaeche: "KNOTEN INDEX SUB" in hex, z.B. "01 2933 02".
# NUR LESEN - das Kommandobyte ist fest 0x40. Antwort erscheint in "Lesebefehl Antwort".
  - platform: template
    name: "Lesebefehl (KN IDX SUB hex)"
    web_server:
      sorting_group_id: g_lesen
      sorting_weight: 1
    id: lese_eingabe
    optimistic: true
    mode: text
    max_length: 24
    on_value:
      then:
        - lambda: |-
            unsigned kn = 0, idx = 0, sub = 0;
            if (sscanf(x.c_str(), "%x %x %x", &kn, &idx, &sub) != 3 || kn < 1 || kn > 127 || idx > 0xFFFF || sub > 0xFF) {
              id(lese_antwort).publish_state("ungueltig - Format: 01 2933 02"); return;
            }
            if (millis() - id(letzter_frame) > 30000) { id(lese_antwort).publish_state("Bus tot - nicht gesendet"); return; }
            id(cmd_kn) = kn; id(cmd_idx) = idx; id(cmd_sub) = sub; id(cmd_aktiv) = true;
            id(lese_antwort).publish_state("gesendet, warte ...");
            std::vector<uint8_t> d = {0x40, (uint8_t)(idx & 0xFF), (uint8_t)(idx >> 8), (uint8_t)sub, 0, 0, 0, 0};
            id(my_can_bus)->send_data(0x600 + kn, false, d);

canbus:
  - platform: esp32_can
    id: my_can_bus
    can_id: 0x602
    tx_pin: GPIO27   # WeAct CAN485: CAN-TX
    rx_pin: GPIO26   # WeAct CAN485: CAN-RX
    bit_rate: 50kbps
    on_frame:
      # --- 0. ROHMITSCHNITT: JEDER Frame nach MQTT (2026-09-26) -------------
      #   can_id_mask 0x000 laesst ALLES durch - auch die unten dekodierten.
      #   Zweck: (a) herausfinden, ob ein Brennerstatus auf dem Bus liegt
      #   (Taktung!), (b) mitschneiden, welche Telegramme die Weishaupt-App
      #   schickt, wenn sie etwas verstellt. Der WEM ist dabei der legitime
      #   Schreiber - wir lernen von ihm, statt am Kessel zu raten.
      #   DAS BLEIBT REINES ZUHOEREN: es geht kein Byte auf den Bus.
      #   Zum Abschalten diesen Eintrag auskommentieren und neu per OTA.
      - can_id: 0x000
        can_id_mask: 0x000
        then:
          - lambda: |-
              id(letzter_frame) = millis();
              if (id(cmd_aktiv) && can_id == (uint32_t)(0x580 + id(cmd_kn)) && x.size() >= 8
                  && ((x[2] << 8) | x[1]) == id(cmd_idx) && x[3] == id(cmd_sub)) {
                char t[80];
                if (x[0] == 0x80) {
                  snprintf(t, sizeof(t), "%02X %04X/%02X: Abbruch %02X%02X%02X%02X (Objekt fehlt?)",
                           id(cmd_kn), id(cmd_idx), id(cmd_sub), x[7], x[6], x[5], x[4]);
                } else {
                  int n = (x[0] == 0x4F) ? 1 : (x[0] == 0x4B) ? 2 : (x[0] == 0x47) ? 3 : 4;
                  int32_t v = 0;
                  for (int i = n - 1; i >= 0; i--) v = (v << 8) | x[4 + i];
                  if (n == 2) v = (int16_t) v;
                  snprintf(t, sizeof(t), "%02X %04X/%02X = %ld (0x%0*lX, %d Byte)",
                           id(cmd_kn), id(cmd_idx), id(cmd_sub), (long) v, n * 2, (unsigned long) (v & (n == 4 ? 0xFFFFFFFF : ((1UL << (8 * n)) - 1))), n);
                }
                id(lese_antwort).publish_state(t);
                id(cmd_aktiv) = false;
              }
              char buf[48];
              int n = snprintf(buf, sizeof(buf), "%03X:", (unsigned)can_id);
              for (size_t i = 0; i < x.size() && n < (int)sizeof(buf) - 3; i++)
                n += snprintf(buf + n, sizeof(buf) - n, "%02X", x[i]);
              mqtt::global_mqtt_client->publish("weact-can485-weishaupt/canraw", buf);

      # --- 1. PDO Verarbeitung (Cyclic Map) ---
      - can_id: 0x201
        then:
          - lambda: |-
              id(wem_aussentemp).publish_state((int16_t(x[2] << 8 | x[1])) * 0.1f);
              // Byte0 = Objekt 0x28BE = Systembetriebsart (0 Aus,1 Standby,2 Sommer,3 Automatik; geronet1)
              int sb = x[0];
              id(wem_systembetriebsart_code).publish_state((float) sb);
              const char* t = "unbekannt";
              if (sb == 0) t = "Aus"; else if (sb == 1) t = "Standby"; else if (sb == 2) t = "Sommer"; else if (sb == 3) t = "Automatik";
              id(wem_systembetriebsart).publish_state(t);
      
      - can_id: 0x241
        then:
          - lambda: |- 
              id(wem_heizanforderung).publish_state((int16_t(x[1] << 8 | x[0])) * 0.1f);
              id(wem_warmwasser).publish_state((int16_t(x[7] << 8 | x[6])) * 0.1f);

      # --- Kesselstatus + WW-aktiv aus PDO 0x182 (2026-09-26, reines Mithoeren) ---
      #   Byte0 = Objekt 0x2530 (per PDO-Mapping-Read belegt).
      - can_id: 0x182
        then:
          - lambda: |-
              uint8_t st = x[0];
              const char* s = "unbekannt";
              switch (st) {
                case 0:   s = "Standby"; break;
                case 1:   s = "Aus"; break;
                case 10:  s = "Heizbetrieb"; break;
                case 15:  s = "Warmwasserbetrieb"; break;
                case 101: s = "Kaminfeger"; break;
                case 104: s = "Wartung"; break;
              }
              id(wem_kesselstatus).publish_state(s);
              id(wem_ww_aktiv).publish_state(st == 15);
              id(wem_kesselstatus_code).publish_state((float) st);
              id(wem_ww_aktiv_num).publish_state(st == 15 ? 1.0f : 0.0f);

      # --- Statusbits Knoten 1 aus PDO 0x1C1 (Byte2-3 = Objekt 0x274D) ---
      #   KEINE Betriebsart, sondern ein Bitfeld (belegt 2026-09-26):
      #   0x0010 = Warmwasserladung aktiv, 0x1000 = Heizkreis Standby.
      #   0x1C1 kommt nur bei Aenderung; zusaetzlich wird 0x274D alle 20 s gelesen.
      - can_id: 0x1C1
        then:
          - lambda: |-
              uint16_t m = (x[3] << 8) | x[2];
              std::string s = (m & 0x1000) ? "Standby" : "Zeitprogramm";
              if (m & 0x0010) s += " + WW-Ladung";
              uint16_t rest = m & ~0x1010;
              if (rest) { char b[12]; snprintf(b, sizeof(b), " (0x%04X)", rest); s += b; }
              id(wem_betriebsart_hk).publish_state(s);
              id(wem_betriebsart_hk_code).publish_state((float) m);

      # --- SDO-Antworten Knoten 1 (0x581), nur LESEN ---
      - can_id: 0x581
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40) return;
              uint16_t idx = (x[2] << 8) | x[1];
              uint8_t sub = x[3];
              if (idx == 0x274D && sub == 0) {
                uint16_t m = (x[5] << 8) | x[4];
                std::string s = (m & 0x1000) ? "Standby" : "Zeitprogramm";
                if (m & 0x0010) s += " + WW-Ladung";
                uint16_t rest = m & ~0x1010;
                if (rest) { char b[12]; snprintf(b, sizeof(b), " (0x%04X)", rest); s += b; }
                id(wem_betriebsart_hk_code).publish_state((float) m);
                id(wem_betriebsart_hk).publish_state(s);
              } else if (idx == 0x2640 && sub == 3) {
                int16_t v = (int16_t)((x[5] << 8) | x[4]);
                id(wem_ww_vlsoll).publish_state(v * 0.1f);
              } else if (idx == 0x2933 && sub == 2) {
                // Heizkreis-Betriebsart (JSON MI02 0x2533/02), Weishaupt-Aufzaehlung
                uint8_t b = x[4];
                static const char* n[] = {"?", "Standby", "Zeitprogramm 1", "Zeitprogramm 2", "Zeitprogramm 3", "Sommer", "Komfort", "Normal", "Absenk"};
                id(hk_betriebsart_code).publish_state((float) b);
                id(hk_betriebsart).publish_state(b <= 8 ? n[b] : "unbekannt");
                if (b >= 1 && b <= 8) id(hk_setzen).publish_state(n[b]);
                if (id(schalt_ziel) == 1) {
                  id(schalt_status).publish_state((id(uhr).now().is_valid() ? id(uhr).now().strftime("%H:%M:%S ") : std::string("")) + (b == id(schalt_wert) ? std::string("OK: Heizkreis steht auf ") + n[b]
                                                                        : std::string("NICHT uebernommen, Heizkreis steht auf ") + (b <= 8 ? n[b] : "?")));
                  id(schalt_ziel) = 0;
                }
              } else if (idx == 0x2A20 && sub == 2) {
                // Warmwasser-Betriebsart (JSON MI03 0x2520/02): 1 = Ein, 2 = Aus
                uint8_t b = x[4];
                id(ww_betriebsart_code).publish_state((float) b);
                id(ww_betriebsart).publish_state(b == 1 ? "Ein" : (b == 2 ? "Aus" : "unbekannt"));
                if (b == 1 || b == 2) id(ww_setzen).publish_state(b == 1 ? "Ein" : "Aus");
                if (id(schalt_ziel) == 2) {
                  id(schalt_status).publish_state((id(uhr).now().is_valid() ? id(uhr).now().strftime("%H:%M:%S ") : std::string("")) + (b == id(schalt_wert) ? std::string("OK: Warmwasser ") + (b == 1 ? "Ein" : "Aus")
                                                                        : std::string("NICHT uebernommen, Warmwasser ") + (b == 1 ? "Ein" : (b == 2 ? "Aus" : "?"))));
                  id(schalt_ziel) = 0;
                }
              } else if (sub == 2 && (idx == 0x2958 || idx == 0x2A2C || idx == 0x2A39 || idx == 0x2907)) {
                int16_t v = (int16_t)((x[5] << 8) | x[4]);
                if (v == (int16_t)0x8000) return;
                float t = v * 0.1f;
                if (idx == 0x2958) id(hk_raumsoll_akt).publish_state(t);
                else if (idx == 0x2A2C) id(ww_soll_akt).publish_state(t);
                else if (idx == 0x2A39) id(ww_soll_normal).publish_state(t);
                else id(hk_vorlauf).publish_state(t);
              }

      # --- 2. SDO Antworten (ID 0x582) ---
      - can_id: 0x582
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40) return;   // nur Lese-Antworten, keine Aborts/ACKs
              uint16_t idx = (x[2] << 8) | x[1];
              uint8_t sub = x[3];
              int32_t raw_val = (int32_t)((uint32_t)x[7] << 24 | (uint32_t)x[6] << 16 | (uint32_t)x[5] << 8 | (uint32_t)x[4]);

              if (idx == 0x2714 && sub == 0x02) id(wem_druck).publish_state(raw_val * 0.01f);
              else if (idx == 0x2534 && sub == 0x00) id(wem_leistung).publish_state(raw_val * 0.01f);
              else if (idx == 0x2540 && sub == 0x00) id(wem_drehzahl).publish_state((float)raw_val);
              else if (idx == 0x2536 && sub == 0x00) id(wem_vorlauf).publish_state(raw_val * 0.1f);
              // KORREKTUR 2026-09-26: Ruecklauf ist 0x2537, NICHT 0x2533.
              //   Belegt durch Abgleich mit einer zweiten Anzeige:
              //   0x2537 = 194 -> 19,4 Grad, exakt der App-Wert; 0x2533 zeigte 15,9.
              //   Die alte Zuordnung stammt aus der Vorlage eines fremden Hauses.
              //   Was 0x2533 wirklich ist, ist UNGEKLAERT - deshalb bleibt es ungenutzt.
              else if (idx == 0x2537 && sub == 0x00) id(wem_ruecklauf).publish_state(raw_val * 0.1f);

              // --- neu am 2026-09-26, alle am Bus mitgehoert (der WEM fragt sie ohnehin) ---
              else if (idx == 0x2532 && sub == 0x00) id(wem_kessel).publish_state(raw_val * 0.1f);
              else if (idx == 0x2545 && sub == 0x00) id(wem_vorlauf_soll).publish_state(raw_val * 0.1f);
              else if (idx == 0x2541 && sub == 0x00) {
                // Brennerstatus. Die TAKTUNG ist die aussagekraeftigste Groesse
                // fuer die Brennwertnutzung: haeufiges An/Aus heisst wenig
                // Kondensation und mehr Verschleiss.
                int b = (raw_val != 0) ? 1 : 0;
                id(wem_brenner).publish_state((float) b);
                if (b == 1 && id(brenner_vorher) == 0) {
                  id(brenner_starts) += 1;
                  id(wem_brennerstarts).publish_state((float) id(brenner_starts));
                }
                id(brenner_vorher) = b;
              }
              else if (idx == 0x2713 && sub == 0x02) id(wem_volumenstrom).publish_state((float)raw_val);
              else if (idx == 0x2726 && sub == 0x02) id(wem_wm_heizung).publish_state(raw_val * 0.01f);
              else if (idx == 0x2727 && sub == 0x02) id(wem_wm_ww).publish_state(raw_val * 0.01f);
              else if (idx == 0x2728 && sub == 0x02) id(wem_wm_gesamt).publish_state(raw_val * 0.01f);

sensor:
  - platform: template
    name: "WEM-JSON Fehler (Zaehler)"
    id: wem_fehler_sensor
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 600s
    lambda: 'return id(wem_fehler);'
    web_server:
      sorting_group_id: g_schalten
      sorting_weight: 4
  # --- Eigendiagnose des Boards (2026-09-26 nachgeruestet) ---------
  # Das Board liegt im Installationskanal im Heizungsraum: warme
  # Umgebung, Kunststoff staut Waerme, und ANFASSEN geht dort nicht
  # mehr. Ohne diese beiden Werte waere ein Hitze- oder Funkproblem
  # nur als sporadischer Neustart sichtbar - und den sucht man dann
  # im WLAN statt im Kanal.
  - platform: uptime
    name: "Laufzeit"
    update_interval: 60s
    web_server:
      sorting_group_id: g_diag
      sorting_weight: 3
  - platform: template
    name: "Letzter CAN-Frame vor"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (millis() - id(letzter_frame)) / 1000.0f;'
    web_server:
      sorting_group_id: g_diag
      sorting_weight: 4
  - platform: wifi_signal
    name: "WLAN-Signal"
    web_server:
      sorting_group_id: g_diag
      sorting_weight: 1
    update_interval: 60s

  # Zahlenwerte (fuer Telegraf/InfluxDB), 2026-09-26
  - platform: template
    name: "Heizkreis Betriebsart Code"
    web_server:
      sorting_group_id: g_codes
      sorting_weight: 3
    id: hk_betriebsart_code
    update_interval: never
  - platform: template
    name: "Warmwasser Betriebsart Code"
    web_server:
