# WeAct CAN485 DevBoard V1 (ESP32-D0WD-V3) am Weishaupt-CAN-Bus
# Angepasst 2026-09-25 aus der C3-SuperMini-Vorlage von MenkeC.
#
#   CAN TX = GPIO27   CAN RX = GPIO26   50 kbps
#   120-Ohm-Terminierung sitzt auf einem SCHALTER -> AUS lassen,
#   wir haengen MITTEN am Bus (zwei Abschluesse gibt es dort schon).
#   Board ist 2,5 kV galvanisch isoliert - Heizung und ESP koennen sich
#   gegenseitig nicht beschaedigen.
#
# ERSTINBETRIEBNAHME: nur LAUSCHEN. Die PDOs 0x201 und 0x241 sendet der
# Kessel von selbst; dafuer muss nichts auf den Bus geschickt werden.
# Die SDO-Abfragen (can_id 0x602) erst einschalten, wenn das Mithoeren
# steht - sie sind der einzige Teil, der aktiv sendet.
#
# Alle persoenlichen Werte stehen in secrets.yaml (Vorlage: secrets.yaml.example).
#
esphome:
  name: weact-can485-weishaupt
  friendly_name: Weishaupt WTC-GW 15-B
  project:
    name: "weishaupt-wem-can.esphome"
    version: "9 (2026-09-26)"

esp32:
  board: esp32dev          # WeAct CAN485 DevBoard V1 = ESP32-D0WD-V3
  framework:
    type: esp-idf

# Enable logging
logger:
  # Verhindert, dass der Logger überhaupt Log-Nachrichten an MQTT schickt
  level: DEBUG # Lokal (USB/Web) darf er ruhig noch debuggen
  logs:
    mqtt: NONE       # Schaltet das MQTT-Logging-Backend komplett aus
    mqtt.client: NONE
    mqtt.component: NONE
    canbus: ERROR    # Falls du CAN-Fehler zumindest intern sehen willst

# Enable Home Assistant API
# api:  # nicht genutzt - Anbindung laeuft ueber MQTT
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Empfohlen: DHCP und im Router eine feste Zuordnung (Reservierung) fuer das Board.
  # Findet OTA das Board nicht per mDNS, hier die IP eintragen:
  # use_address: <IP des Boards>

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Weishaupt-Wtc-Gw-15-B"
    password: !secret ap_password

captive_portal:

# Weboberflaeche im LAN: http://<IP des Boards>  (Live-Werte, Log, Schalter)
#   local: true bettet JS/CSS in den Flash ein. OHNE das holt die Seite
#   ihre Skripte von esphome.io - ohne Internet bliebe sie dann leer.
#   Mit Passwort (web_password), weil man hier die Heizung schalten kann.
#   Basic Auth laeuft unverschluesselt ueber HTTP: nur im LAN betreiben.
web_server:
  port: 80
  version: 3
  local: true
  auth:
    username: admin
    password: !secret web_password
  sorting_groups:
    - id: g_wem
      name: "Einstellungen"
      sorting_weight: 95
    - id: g_schalten
      name: "Schalten (ueber WEM, Kontrolle am Bus)"
      sorting_weight: 5
    - id: g_kessel
      name: "Kessel"
      sorting_weight: 10
    - id: g_betrieb
      name: "Betriebsarten und Sollwerte"
      sorting_weight: 20
    - id: g_energie
      name: "Energie"
      sorting_weight: 30
    - id: g_lesen
      name: "Lesebefehl (nur lesen)"
      sorting_weight: 40
    - id: g_schreiben
      name: "Schreibbefehl ueber WEM (Experten)"
      sorting_weight: 45
    - id: g_codes
      name: "Zahlencodes fuer Grafana"
      sorting_weight: 80
    - id: g_diag
      name: "Diagnose"
      sorting_weight: 90
    - id: g_fw
      name: "Firmware"
      sorting_weight: 100

time:
  - platform: sntp
    id: uhr
    timezone: Europe/Berlin
    servers: [0.pool.ntp.org, 1.pool.ntp.org]

http_request:
  timeout: 10s
  verify_ssl: false

mqtt:
  broker: !secret mqtt_broker
  port: 1883              # unverschluesselt, nur LAN
#  topic_prefix: heizung/wem
  # Deaktiviert das Senden von Log-Nachrichten an MQTT
#  log_topic: null
  username: !secret mqtt_user
  password: !secret mqtt_password
  # Befehlskanal (2026-09-26): NUR LESEN. Das Kommandobyte ist fest 0x40 (SDO-Upload),
  # schreibende Befehle sind ueber diesen Kanal NICHT moeglich.
  #   .../cmd/lesen  "KNOTEN INDEX SUB"            hex, z.B. "41 2533 02"
  #   .../cmd/scan   "KNOTEN START ENDE MAXSUB"    hex, z.B. "01 2000 2FFF 3"
  #   .../cmd/stop   (beliebig)                     bricht den Scan ab
  on_message:
    - topic: weact-can485-weishaupt/cmd/lesen
      then:
        - lambda: |-
            unsigned kn = 0, idx = 0, sub = 0;
            if (sscanf(x.c_str(), "%x %x %x", &kn, &idx, &sub) != 3 || kn < 1 || kn > 127 || idx > 0xFFFF || sub > 0xFF) {
              ESP_LOGW("cmd", "lesen: ungueltig '%s'", x.c_str()); return;
            }
            if (millis() - id(letzter_frame) > 30000) { ESP_LOGW("cmd", "Bus tot - nicht gesendet"); return; }
            id(cmd_kn) = kn; id(cmd_idx) = idx; id(cmd_sub) = sub; id(cmd_aktiv) = true;
            std::vector<uint8_t> d = {0x40, (uint8_t)(idx & 0xFF), (uint8_t)(idx >> 8), (uint8_t)sub, 0, 0, 0, 0};
            id(my_can_bus)->send_data(0x600 + kn, false, d);
            ESP_LOGI("cmd", "lesen Knoten %02X Objekt %04X/%02X", kn, idx, sub);
    - topic: weact-can485-weishaupt/cmd/scan
      then:
        - lambda: |-
            unsigned kn = 0, a = 0, e = 0, ms = 0;
            if (sscanf(x.c_str(), "%x %x %x %x", &kn, &a, &e, &ms) != 4 || kn < 1 || kn > 127 || a > e || e > 0xFFFF || ms > 10) {
              ESP_LOGW("cmd", "scan: ungueltig '%s'", x.c_str()); return;
            }
            id(scan_knoten) = kn; id(scan_idx) = a; id(scan_ende) = e; id(scan_maxsub) = ms; id(scan_sub) = 0; id(scan_aktiv) = true;
            ESP_LOGI("scan", "Objektscan gestartet Knoten %02X %04X-%04X Sub 0-%u", kn, a, e, ms);
    - topic: weact-can485-weishaupt/cmd/stop
      then:
        - lambda: |-
            id(scan_aktiv) = false; ESP_LOGI("scan", "Objektscan abgebrochen");

 # CAN Bus Konfiguration (TWAI)
# Zustand fuer die Brenner-Flankenerkennung (2026-09-26).
# brenner_starts zaehlt AB INBETRIEBNAHME, nicht den Gesamtzaehler der
# Anlage - fuer die Taktung (Starts pro Stunde) genuegt das.
globals:
  # Objektscan Knoten 1 (2026-09-26 abends): nur LESEN (0x40), 0x2000-0x2FFF, Sub 0-3
  - id: scan_aktiv
    type: bool
    initial_value: 'false'
  - id: scan_idx
    type: int
    initial_value: '0x2000'
  - id: scan_knoten
    type: int
    initial_value: '1'
  - id: scan_ende
    type: int
    initial_value: '0x2FFF'
  - id: scan_maxsub
    type: int
    initial_value: '3'
  # Schalten ueber WEM-JSON (v8): letzter Befehl, fuer die 60-s-Sperre
  - id: letzter_befehl
    type: uint32_t
    initial_value: '0'
  - id: schalt_ziel
    type: int
    initial_value: '0'   # 0 = keiner, 1 = Heizkreis, 2 = Warmwasser
  - id: schalt_wert
    type: int
    initial_value: '0'
  - id: schreib_vg
    type: std::string
  - id: wem_fehler
    type: int
    restore_value: yes
    initial_value: '0'
  # Offener Lesebefehl aus der Weboberflaeche (Antwort wird zugeordnet)
  - id: cmd_aktiv
    type: bool
    initial_value: 'false'
  - id: cmd_kn
    type: int
    initial_value: '0'
  - id: cmd_idx
    type: int
    initial_value: '0'
  - id: cmd_sub
    type: int
    initial_value: '0'
  # Bus-off-Waechter: Zeitpunkt des letzten empfangenen CAN-Frames
  - id: letzter_frame
    type: uint32_t
    initial_value: '0'
  - id: scan_sub
    type: int
    initial_value: '0'
  - id: brenner_vorher
    type: int
    initial_value: '0'
  - id: brenner_starts
    type: int
    restore_value: yes
    initial_value: '0'


