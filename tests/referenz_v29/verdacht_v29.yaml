# Paket VERDACHT (Regeln): Betriebsarten nur dann vom Bus lesen, wenn das Mithoeren
# einen Verdacht liefert, dass sich etwas geaendert hat. Braucht die Pakete kessel und
# warmwasser; mit Paket mqtt zusaetzlich einstellbar per Datei (cmd/regeln) und Befehl (cmd/regel).
#
# Was die Regeln auf den Bus schicken duerfen: ausschliesslich SDO-LESE-Anfragen (0x40) an
# Knoten 1 (0x601), ueber dasselbe Anlass-Nachlesen wie "Status lesen":
#   Heizkreis-Betriebsart 0x2933/2, Warmwasser 0x2A20/2, 0x2A2C/2, 0x2A39/2.
# Nie etwas an den Kessel (Knoten 2), nie eine WEM-JSON-Anfrage, keine periodische Abfrage.
# Gesendet wird nur bei lebendem Bus und ausserhalb der Anlaufpause. Jede Regel hat einen
# Mindestabstand, alle zusammen eine Obergrenze pro Stunde.
#
# Die festen Regeln (Logik in der Firmware, nur an/aus und Abstand einstellbar):
#   R1  WEM fragt den Kessel 2101/0A, 2102/0D, 2102/01 ab (so bei jedem Warmwasser-Wechsel)  -> WW lesen
#   R2  Kessel geht in den Warmwasserbetrieb, bekannt ist aber "Warmwasser Aus"             -> WW lesen
#   R3  Standby-Bit 0x1000 der WEM-Statusbits (PDO 0x1C1) aendert sich (Heizung ein/Standby) -> HK lesen
#   R4  Heizanforderung passt nicht zur bekannten Heizkreis-Betriebsart                    -> HK lesen
#   R5  uebrige Statusbits (ohne Standby, WW-Ladung, Heizbetrieb) aendern sich               -> HK lesen
# Der WEM fragt den Kessel mit Kommandobyte 0xA4 (SDO Block-Upload) ab, nicht mit 0x40 - R1
# erkennt seit v25 beide (bis v24 nur 0x40, deshalb hat R1 in v22-v24 nie ausgeloest).
# R1-R5 ruhen 2 min nach einem eigenen Schaltbefehl (der liest ohnehin selbst nach).
# Jede feste Regel hat ihren eigenen Schalter. Vorgabe: R1, R2, R3 an; R4, R5 aus.
# Die Entscheidungslogik steht in regellogik.h (ohne ESPHome, getestet in tests/).
# Eigene Regeln (experimentell): generische Trigger "CAN-ID + Maske + Muster", mit EIGENEM
# Hauptschalter (Vorgabe aus), der nur fuer die eigenen Regeln gilt. Siehe REGELN.md.
# Jede Ausloesung und jedes Ergebnis steht im Log (Tag "verdacht", INFO; Unterdrueckungen DEBUG)
# und geht als JSON (nicht retained) an <geraet>/verdacht/ereignis.

substitutions:
  # Startwerte, solange noch nichts gespeichert ist (danach gelten Weboberflaeche bzw. Datei)
  regel_r1_start: RESTORE_DEFAULT_ON
  regel_r2_start: RESTORE_DEFAULT_ON
  regel_r3_start: RESTORE_DEFAULT_ON
  regel_r4_start: RESTORE_DEFAULT_OFF       # Rueckrechnung nur fuer milde Aussentemperaturen geeicht
  regel_r5_start: RESTORE_DEFAULT_OFF       # loest bei jedem Heizbedarf-Wechsel aus
  regel_abstand_r1: "1"         # die Folge kommt genau einmal je Umschaltung
  regel_abstand_r2: "10"
  regel_abstand_r3: "1"         # jede Standby-Bit-Aenderung ist ein echtes Ereignis
  regel_abstand_r4: "30"
  regel_abstand_r5: "5"
  regeln_max_h: "6"
  eigene_regeln_start: RESTORE_DEFAULT_OFF  # Hauptschalter NUR fuer die eigenen Regeln

# Zustand der Regeln: wc::Verdacht im Bauteil (kern.h); die Logik in regellogik.h und verdacht.h.
# Die Statusbits loesen nicht mehr von selbst aus, sondern als Regel R3.
weishaupt_can:
  statusbits_anlass: false
  verdacht: true             # gespeicherte Werte der Regeln anlegen (eigene Regeln, Datei-Stand, R3/R5)

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          std::string f;
          if (!vd::aus_speicher(id(wcan)->vd.speicher.data(), f)) ESP_LOGW("verdacht", "eigene Regeln: %s", f.c_str());
          ESP_LOGI("verdacht", "%u eigene Regel(n) geladen", (unsigned) vd::eigene().size());
          id(vd_eigene_ts).publish_state(vd::anzeige());
          #ifdef USE_MQTT
          mqtt::global_mqtt_client->subscribe("${geraet}/cmd/regeln", [](const std::string &t, const std::string &p) {
            id(vd_datei)->execute(p);
          });
          mqtt::global_mqtt_client->subscribe("${geraet}/cmd/regel", [](const std::string &t, const std::string &p) {
            id(vd_befehl)->execute(p);
          });
          #endif

web_server:
  sorting_groups:
    - id: g_verdacht
      name: "Regeln (R1-R5)"
      sorting_weight: 47
    - id: g_eigene
      name: "Eigene Regeln (experimentell)"
      sorting_weight: 48

script:
  # Gemeinsame Pruefung und Ausloesung. ziel: 1 Heizkreis, 2 Warmwasser, 3 beide.
  # an = false: SCHATTENMODUS - die Bedingung hat zugetroffen, die Regel ist aber aus. Dann wird
  # nicht gelesen, nur geloggt (INFO) und als Ereignis "waere" gemeldet; es gilt ein eigener
  # Mindestabstand je Regel, die Obergrenze pro Stunde und das Protokoll bleiben unberuehrt.
  - id: vd_regel
    mode: queued
    max_runs: 10
    parameters:
      regel: string
      ziel: int
      abstand: int
      an: bool
    then:
      - lambda: |-
          uint32_t jetzt = millis();
          const char *zt = ziel == 1 ? "hk" : (ziel == 2 ? "ww" : "beide");
          // Entscheidung in regellogik.h (rl::regel_pruefen), hier nur Log und Folgen
          auto &v = id(wcan)->vd;
          switch (rl::regel_pruefen(regel, an, abstand, (int) id(vd_max_h).state, id(wcan)->bus.bereit(jetzt), jetzt,
                                    v.letzt, v.letzt_schatten, v.zeiten)) {
            case rl::Ergebnis::SCHATTEN_ABSTAND:
              ESP_LOGD("verdacht", "%s waere ausgeloest (Regel aus), Mindestabstand %d min - nicht gemeldet", regel.c_str(), abstand); return;
            case rl::Ergebnis::SCHATTEN_GEMELDET:
              ESP_LOGI("verdacht", "%s waere ausgeloest (Regel aus) - nicht gelesen", regel.c_str());
              id(vd_ereignis)->execute(regel, std::string("waere"), std::string(zt), std::string(""), -1);
              return;
            case rl::Ergebnis::BUS_NICHT_BEREIT:
              ESP_LOGD("verdacht", "%s: Bus nicht bereit (Anlaufpause/Bus schweigt) - nicht gelesen", regel.c_str()); return;
            case rl::Ergebnis::ABSTAND:
              ESP_LOGD("verdacht", "%s: Mindestabstand %d min - nicht gelesen", regel.c_str(), abstand); return;
            case rl::Ergebnis::OBERGRENZE:
              ESP_LOGD("verdacht", "%s: Obergrenze %d/h erreicht - nicht gelesen", regel.c_str(), (int) id(vd_max_h).state); return;
            case rl::Ergebnis::AUSLOESEN:
              break;
          }
          std::string zeit = id(wcan)->zeit("%d.%m. %H:%M:%S");
          if (zeit.empty()) zeit = std::string("seit Start ") + to_string(jetzt / 1000) + " s";
          // offene Lesung merken und nachlesen (die 2-min-Grenze gilt nicht: die Regel hat ihren eigenen Abstand)
          id(wcan)->vd.ausgeloest(regel, ziel, jetzt, id(wcan)->anlass);
          ESP_LOGI("verdacht", "%s ausgeloest -> lese %s", regel.c_str(), ziel == 1 ? "Heizkreis" : (ziel == 2 ? "Warmwasser" : "beide"));
          id(vd_ereignis)->execute(regel, std::string("ausgeloest"), std::string(ziel == 1 ? "hk" : (ziel == 2 ? "ww" : "beide")), std::string(""), -1);
          if (regel == "R1") id(vd_r1_zul).publish_state(zeit);
          else if (regel == "R2") id(vd_r2_zul).publish_state(zeit);
          else if (regel == "R3") id(vd_r3_zul).publish_state(zeit);
          else if (regel == "R4") id(vd_r4_zul).publish_state(zeit);
          else if (regel == "R5") id(vd_r5_zul).publish_state(zeit);
          else if (auto *r = vd::finden(regel)) { r->zuletzt = zeit; r->anzahl++; id(vd_stand)->execute(); }

  # Ereignis als JSON (NICHT retained) an <geraet>/verdacht/ereignis - fuer Telegraf/Grafana/HA.
  # phase: ausgeloest | ergebnis | keine_antwort; ziel: hk | ww | beide; geaendert: -1 = null, 0/1
  - id: vd_ereignis
    mode: queued
    max_runs: 10
    parameters:
      regel: string
      phase: string
      ziel: string
      wert: string
      geaendert: int
    then:
      - lambda: |-
          #ifdef USE_MQTT
          if (!mqtt::global_mqtt_client->is_connected()) return;
          std::string s = vd::ereignis_json(regel, phase, ziel, wert, geaendert, id(wcan)->zeit("%Y-%m-%dT%H:%M:%S"));
          mqtt::global_mqtt_client->publish("${geraet}/verdacht/ereignis", s, 0, false);
          #endif

  # Protokoll: neueste zuerst, 10 Eintraege seit dem letzten Neustart
  - id: vd_eintrag
    mode: queued
    parameters:
      text: string
    then:
      - lambda: |-
          ESP_LOGI("verdacht", "Ergebnis %s", text.c_str());
          auto &p = id(wcan)->vd.protokoll;
          p.neu(id(wcan)->zeit("%d.%m. %H:%M ") + text);
          id(vd_protokoll_ts).publish_state(p.kurz());
          #ifdef USE_MQTT
          mqtt::global_mqtt_client->publish("${geraet}/verdacht/protokoll", p.lang(), 0, true);
          #endif

  # aktiven Stand als JSON veroeffentlichen (retained) und Anzeige der eigenen Regeln erneuern
  - id: vd_stand
    mode: queued
    max_runs: 5
    then:
      - lambda: |-
          id(vd_eigene_ts).publish_state(vd::anzeige());
          #ifdef USE_MQTT
          if (!mqtt::global_mqtt_client->is_connected()) return;
          switch_::Switch *sw[] = {id(vd_r1), id(vd_r2), id(vd_r3), id(vd_r4), id(vd_r5)};
          number::Number *ab[] = {id(vd_ab_r1), id(vd_ab_r2), id(vd_ab_r3), id(vd_ab_r4), id(vd_ab_r5)};
          bool an[5]; int abst[5];
          for (int i = 0; i < 5; i++) { an[i] = sw[i]->state; abst[i] = (int) ab[i]->state; }
          std::string s = vd::stand_json("${firmware}", id(wcan)->vd.datei_version, an, abst, (int) id(vd_max_h).state,
                                         id(vd_eigene_haupt).state);
          id(wcan)->vd.stand_gesendet = mqtt::global_mqtt_client->publish("${geraet}/regeln/stand", s, 0, true);
          #endif

  # eigene Regeln dauerhaft speichern
  - id: vd_speichern
    mode: queued
    then:
      - lambda: |-
          std::string s = vd::speicherform();
          if (!wc::speicher_schreiben(id(wcan)->vd.speicher, s))
            ESP_LOGE("verdacht", "eigene Regeln zu gross (%u Byte) - nicht gespeichert", (unsigned) s.size());

  # Datei (JSON) uebernehmen - per MQTT cmd/regeln
  - id: vd_datei
    mode: queued
    parameters:
      txt: string
    then:
      - lambda: |-
          std::string z = id(wcan)->zeit("%H:%M:%S ");
          uint32_t h = vd::fnv(txt);
          if (h == id(wcan)->vd.datei_hash) {
            ESP_LOGI("verdacht", "Regeln-Datei unveraendert (schon uebernommen) - ignoriert");
            id(vd_stand)->execute();
            return;
          }
          vd::Datei d; std::string f;
          if (!vd::datei_lesen(txt, d, f)) {
            id(vd_datei_ts).publish_state(z + "ABGELEHNT: " + f);
            ESP_LOGW("verdacht", "Regeln-Datei abgelehnt: %s", f.c_str());
            return;
          }
          if (d.hat_eigene) {
            // Laufzeitwerte (zuletzt, Anzahl) gleichnamiger Regeln behalten
            for (auto &n : d.eigene) if (auto *alt = vd::finden(n.name)) { n.zuletzt = alt->zuletzt; n.anzahl = alt->anzahl; n.zuletzt_ms = alt->zuletzt_ms; }
            std::vector<vd::Regel> vorher = vd::eigene();
            vd::eigene() = d.eigene;
            if (vd::speicherform().size() >= id(wcan)->vd.speicher.size()) {
              vd::eigene() = vorher;
              id(vd_datei_ts).publish_state(z + "ABGELEHNT: eigene Regeln zu lang (Beschreibungen kuerzen)");
              return;
            }
            id(vd_speichern)->execute();
          }
          switch_::Switch *sw[] = {id(vd_r1), id(vd_r2), id(vd_r3), id(vd_r4), id(vd_r5)};
          number::Number *ab[] = {id(vd_ab_r1), id(vd_ab_r2), id(vd_ab_r3), id(vd_ab_r4), id(vd_ab_r5)};
          for (int i = 0; i < 5; i++) {
            if (d.an[i] == 1) sw[i]->turn_on(); else if (d.an[i] == 0) sw[i]->turn_off();
            if (d.abstand[i] > 0) { auto c = ab[i]->make_call(); c.set_value(d.abstand[i]); c.perform(); }
          }
          if (d.max_h > 0) { auto c = id(vd_max_h).make_call(); c.set_value(d.max_h); c.perform(); }
          if (d.eigene_an == 1) id(vd_eigene_haupt).turn_on(); else if (d.eigene_an == 0) id(vd_eigene_haupt).turn_off();
          id(wcan)->vd.datei_hash = h;
          if (d.version >= 0) id(wcan)->vd.datei_version = d.version;
          char b[144];
          snprintf(b, sizeof(b), "uebernommen (version %d): R1 %s, R2 %s, R3 %s, R4 %s, R5 %s, eigene %s (%u)", d.version,
                   id(vd_r1).state ? "an" : "aus", id(vd_r2).state ? "an" : "aus", id(vd_r3).state ? "an" : "aus",
                   id(vd_r4).state ? "an" : "aus", id(vd_r5).state ? "an" : "aus", id(vd_eigene_haupt).state ? "an" : "aus",
                   (unsigned) vd::eigene().size());
          id(vd_datei_ts).publish_state(z + b);
          ESP_LOGI("verdacht", "Regeln-Datei %s", b);
          id(vd_stand)->execute();

  # Einzelbefehl "NAME an" / "NAME aus" / "NAME loeschen" (NAME = R1..R5, eigene, eigene Regel)
  - id: vd_befehl
    mode: queued
    parameters:
      befehl: string
    then:
      - lambda: |-
          std::string z = id(wcan)->zeit("%H:%M:%S ");
          // Zerlegen und Pruefen in verdacht.h (vd::befehl_zerlegen, getestet), hier nur die Folgen
          vd::RegelBefehl rb = vd::befehl_zerlegen(befehl);
          if (rb.art == vd::BefehlArt::FEHLER || rb.art == vd::BefehlArt::VERALTET) { id(vd_befehl_ts).publish_state(z + rb.fehler); return; }
          bool an = rb.aktion == vd::Aktion::AN;
          std::string name = rb.name;
          switch_::Switch *sw = nullptr;
          if (rb.art == vd::BefehlArt::HAUPT) sw = id(vd_eigene_haupt);
          else if (rb.art == vd::BefehlArt::FEST) {
            switch_::Switch *f[] = {id(vd_r1), id(vd_r2), id(vd_r3), id(vd_r4), id(vd_r5)};
            sw = f[rb.nr - 1];
          }
          if (sw != nullptr) {
            if (an) sw->turn_on(); else sw->turn_off();
            id(vd_befehl_ts).publish_state(z + "OK: " + name + (an ? " an" : " aus"));
            return;
          }
          vd::Regel *r = vd::finden(name);
          if (r == nullptr) { id(vd_befehl_ts).publish_state(z + "keine Regel '" + name + "' (feste: R1-R5, eigene)"); return; }
          if (rb.aktion != vd::Aktion::LOESCHEN) { r->an = an; id(vd_befehl_ts).publish_state(z + "OK: " + r->name + (an ? " an" : " aus")); }
          else {
            std::string n = r->name;
            auto &v = vd::eigene();
            v.erase(std::remove_if(v.begin(), v.end(), [&](const vd::Regel &x) { return x.name == n; }), v.end());
            id(vd_befehl_ts).publish_state(z + "OK: " + n + " geloescht");
          }
          id(vd_speichern)->execute();
          id(vd_stand)->execute();

interval:
  - interval: 10s
    then:
      - lambda: |-
          uint32_t jetzt = millis();
          // offene Lesungen ohne Antwort (3 min) abschliessen
          auto &v = id(wcan)->vd;
          wc::Verdacht::Ergebnis e;
          if (v.abgelaufen(v.offen_hk, "hk", "Heizkreis", jetzt, e)) {
            id(vd_eintrag)->execute(e.eintrag);
            id(vd_ereignis)->execute(e.regel, e.phase, e.ziel, e.wert, e.geaendert);
          }
          if (v.abgelaufen(v.offen_ww, "ww", "Warmwasser", jetzt, e)) {
            id(vd_eintrag)->execute(e.eintrag);
            id(vd_ereignis)->execute(e.regel, e.phase, e.ziel, e.wert, e.geaendert);
          }
          #ifdef USE_MQTT
          if (!mqtt::global_mqtt_client->is_connected()) id(wcan)->vd.stand_gesendet = false;
          else if (!id(wcan)->vd.stand_gesendet) id(vd_stand)->execute();
          #endif

canbus:
  - id: !extend my_can_bus
    on_frame:
      # --- R1/R2/R4: was der WEM an den Kessel schickt (0x602) ---
      # Lese-Anfragen des WEM kommen als SDO Block-Upload-Initiate (Kommandobyte 0xA4), selten als
      # Expedited-Upload (0x40). Bei beiden stehen Index (Bytes 1-2, LE) und Subindex (Byte 3) gleich.
      - can_id: 0x602
        then:
          - lambda: |-
              if (x.size() < 5) return;
              uint32_t j = millis();
              bool eigen = rl::eigen_ruht(id(wcan)->anlass.eigener_befehl_ms, j);
              int v = 0;
              if (rl::ist_leseanfrage(x[0])) {
                if (rl::r1_frame(id(wcan)->vd.r1_a, id(wcan)->vd.r1_b, x, j)) {
                  bool wem_neu = rl::wem_neu(id(wcan)->vd.wem_start, j);
                  if (eigen || wem_neu) ESP_LOGD("verdacht", "R1-Folge erkannt, ruht (%s)", eigen ? "eigener Befehl" : "WEM-Neustart");
                  else id(vd_regel)->execute("R1", 2, (int) id(vd_ab_r1).state, id(vd_r1).state);
                }
              } else if (rl::w252b_frame(id(wcan)->vd.w252b_vorher, x, v)) {
                bool r2 = rl::r2_bei_252b(v, id(wcan)->vd.ww_bekannt);
                bool r4 = rl::r4_bei_252b(v, id(wcan)->vd.hk_bekannt);
                if (r2) { if (eigen) ESP_LOGD("verdacht", "R2 (0x252B=0F) ruht (eigener Befehl)");
                          else id(vd_regel)->execute("R2", 2, (int) id(vd_ab_r2).state, id(vd_r2).state); }
                if (r4) { if (eigen) ESP_LOGD("verdacht", "R4 (0x252B=0A) ruht (eigener Befehl)");
                          else id(vd_regel)->execute("R4", 1, (int) id(vd_ab_r4).state, id(vd_r4).state); }
              }
      # Kesselstatus: 15 Warmwasserbetrieb (R2), 10 Heizbetrieb (R4)
      - can_id: 0x182
        then:
          - lambda: |-
              int st = 0;
              if (!rl::kstatus_flanke(id(wcan)->vd.kstatus_vorher, x, st)) return;
              bool eigen = rl::eigen_ruht(id(wcan)->anlass.eigener_befehl_ms, millis());
              bool r2 = rl::r2_bei_kstatus(st, id(wcan)->vd.ww_bekannt);
              bool r4 = rl::r4_bei_kstatus(st, id(wcan)->vd.hk_bekannt);
              if (r2) { if (eigen) ESP_LOGD("verdacht", "R2 (Kesselstatus 15) ruht (eigener Befehl)");
                        else id(vd_regel)->execute("R2", 2, (int) id(vd_ab_r2).state, id(vd_r2).state); }
              if (r4) { if (eigen) ESP_LOGD("verdacht", "R4 (Kesselstatus 10) ruht (eigener Befehl)");
                        else id(vd_regel)->execute("R4", 1, (int) id(vd_ab_r4).state, id(vd_r4).state); }
      # R3/R5: Statusbits des WEM (0x274D) - m = x[3]<<8 | x[2] (Rohbytes 00 00 00 10 = m 0x1000)
      #   R3 nur Standby-Bit 0x1000 (Heizung ein <-> Standby)
      #   R5 alle uebrigen Bits ohne 0x1000, WW-Ladung 0x0010, Heizbetrieb 0x0040
      - can_id: 0x1C1
        then:
          - lambda: |-
              rl::StatusAenderung e = rl::statusbits(id(wcan)->vd.stby_vorher, id(wcan)->vd.rest_vorher, x);
              if (!e.geaendert) return;
              bool eigen = rl::eigen_ruht(id(wcan)->anlass.eigener_befehl_ms, millis());
              rl::StatusEntscheid s = rl::status_entscheiden(e, eigen, id(vd_r3).state);
              if (e.r3 && eigen) ESP_LOGD("verdacht", "R3 Standby-Bit %d -> %d ruht (eigener Befehl)", e.sv, e.stby);
              if (s.r3) id(vd_regel)->execute("R3", 1, (int) id(vd_ab_r3).state, id(vd_r3).state);
              if (e.r5) {
                if (eigen) ESP_LOGD("verdacht", "R5 Statusbits 0x%04X -> 0x%04X ruht (eigener Befehl)", e.rv, e.rest);
                else if (s.r3_liest) ESP_LOGD("verdacht", "R5 Statusbits 0x%04X -> 0x%04X: R3 liest schon", e.rv, e.rest);
                else if (s.r5) id(vd_regel)->execute("R5", 1, (int) id(vd_ab_r5).state, id(vd_r5).state);
              }
      # R4: Aussentemperatur merken
      - can_id: 0x201
        then:
          - lambda: 'if (x.size() >= 3) id(wcan)->vd.at = reg::pdo_wert(reg::AUSSENTEMP, x);'
      # R4: Vorlaufsoll HZ (PDO 0x241 Bytes 0-1) gegen die bekannte Raumsoll-Stufe
      #   Rueckrechnung RT = (VL - 1,4 + 1,1 * AT) / 2,1 (geeicht bei AT 12,9-15,2 C) -> 18 / 20 / 21
      - can_id: 0x241
        then:
          - lambda: |-
              if (x.size() < 2) return;
              float vl = reg::pdo_wert(reg::VORLAUFSOLL_HZ, x);
              id(wcan)->vd.vl = vl;
              // Bedingung wird auch bei ausgeschaltetem R4 geprueft (Schattenmodus);
              // gleicher Widerspruch wie zuletzt loest nicht erneut aus
              rl::R4Befund b;
              if (!rl::r4_vorlauf(id(wcan)->vd.r4_key, vl, id(wcan)->vd.at, id(wcan)->vd.hk_bekannt, b)) return;
              if (rl::eigen_ruht(id(wcan)->anlass.eigener_befehl_ms, millis())) {
                ESP_LOGD("verdacht", "R4 (Raumsoll-Stufe %d statt %d) ruht (eigener Befehl)", b.stufe, b.soll); return;
              }
              ESP_LOGI("verdacht", "R4: Vorlaufsoll %.1f, AT %.1f -> Raumsoll ~%.1f (Stufe %d), erwartet %d", vl, id(wcan)->vd.at, b.rt, b.stufe, b.soll);
              id(vd_regel)->execute("R4", 1, (int) id(vd_ab_r4).state, id(vd_r4).state);
      # WEM-Neustart (Bootup-Heartbeat 0x701 = 00): R1 ruht danach 5 min
      - can_id: 0x701
        then:
          - lambda: 'if (x.size() >= 1 && x[0] == 0x00) id(wcan)->vd.wem_start = millis() | 1;'
      # Antworten auf Lesungen (Knoten 1): bekannte Betriebsarten, Protokoll "geaendert ja/nein"
      - can_id: 0x581
        then:
          - lambda: |-
              wc::Verdacht::Ergebnis e;
              if (!id(wcan)->vd.antwort(x, e)) return;
              id(vd_eintrag)->execute(e.eintrag);
              id(vd_ereignis)->execute(e.regel, e.phase, e.ziel, e.wert, e.geaendert);
      # Eigene Regeln: CAN-ID gleich und (Daten UND Maske) == Muster
      - can_id: 0x000
        can_id_mask: 0x000
        then:
          - lambda: |-
              // Auch ausgeschaltete eigene Regeln (einzeln aus oder Hauptschalter aus) werden
              // ausgewertet - sie melden dann nur "waere" (Schattenmodus), gelesen wird nicht.
              if (vd::eigene().empty()) return;
              if (rl::gesperrte_id(can_id)) return;      // eigene Anfragen und ihre Antworten nie
              bool haupt = id(vd_eigene_haupt).state;
              for (auto &r : vd::eigene()) {
                if (r.can_id != can_id) continue;
                if (!rl::maske_passt(r.maske, r.muster, x)) continue;
                if (rl::eigen_ruht(id(wcan)->anlass.eigener_befehl_ms, millis())) {
                  ESP_LOGD("verdacht", "%s ruht (eigener Befehl)", r.name.c_str()); continue;
                }
                id(vd_regel)->execute(r.name, (int) r.lesen, (int) r.abstand_min, haupt && r.an);
              }

switch:
