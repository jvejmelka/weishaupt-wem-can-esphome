    name: "Eigene Regeln (Hauptschalter)"
    id: vd_eigene_haupt
    optimistic: true
    restore_mode: ${eigene_regeln_start}
    web_server: { sorting_group_id: g_eigene, sorting_weight: 0 }
    on_turn_on: { script.execute: vd_stand }
    on_turn_off: { script.execute: vd_stand }
  - platform: template
    name: "R1 Warmwasser am Display oder Portal umgeschaltet"
