# Paket WEM-SCHALTEN: Heizkreis-Betriebsart ueber die WEM-JSON-Schnittstelle
# (http://<WEM>/ajax/CanApiJson.json), Kontrolle danach am CAN-Bus.
# Braucht das Paket kessel. Geschrieben wird NIE auf den Bus, nur ueber den WEM.
#
# Warum so vorsichtig: die JSON-Schnittstelle des WEM ist empfindlich. Regelmaessiges
# Abfragen hat sie mehrfach dauerhaft lahmgelegt (nur Stromlos-Machen half), und jede
# Anfrage an ein Objekt, das die Anlage nicht hat (Antwort CM=05), verbraucht einen von
# nur zehn Plaetzen bis zum naechsten Neustart der Heizung. Deshalb:
#   - hoechstens ein Befehl pro Minute (Warteschlange: der NEUESTE Wunsch je Ziel gewinnt)
#   - geschrieben wird nur MI 01/02/03 (Systemgeraet), nie der Kessel
#   - eine CM=05-Antwort wird im Ergebnis gemeldet
#   - der WEM wird nie von selbst abgefragt, nur wenn jemand schaltet
#
# Schalten per MQTT (braucht Paket mqtt):
#   ${geraet}/cmd/heizkreis   Klartext "1".."8", Name ("Zeitprogramm 1", "Standby") oder Kurzform "ZP1"
#                             oder JSON {"id":17,"wert":"ZP2","quelle":"App"} (id und quelle optional)
#   ${geraet}/befehl/status   (retained) JSON je Phase eines Befehls - siehe TOPICS.md:
#                             angenommen -> vorgemerkt -> gesendet -> pruefe_bus -> bestaetigt | gescheitert
#   ${geraet}/schaltprotokoll (retained) die letzten 10 Befehle, einer je Zeile (VERALTET, Klartext)
# Die Buchfuehrung (Warteschlange, Phasen, JSON) steht in befehle.h (getestet in tests/).

web_server:
  sorting_groups:
    - id: g_schalten
      name: "Schalten (ueber WEM, Kontrolle am Bus)"
      sorting_weight: 5
    - id: g_schreiben
      name: "Schreibbefehl ueber WEM (Experten)"
      sorting_weight: 45

http_request:
  timeout: 10s
  verify_ssl: false

globals:
  - id: letzter_befehl          # millis() des letzten WEM-Aufrufs (Sperrminute)
    type: uint32_t
    initial_value: '0'
  - id: schalt_ziel             # laufender Aufruf: 0 keiner, 1 Heizkreis, 2 Warmwasser, 3 Schreibbefehl
    type: int
    initial_value: '0'
  - id: schalt_vg
    type: std::string
  - id: senden
    type: bool
    initial_value: 'false'
  - id: pruefen                 # true, sobald die Kontroll-Leseanfrage am Bus raus ist
    type: bool
    initial_value: 'false'
  # Warteschlange und Phasen der Befehle: bf::schaltung() in befehle.h
  - id: protokoll
    type: std::vector<std::string>
  - id: letzter_gesehen         # fuer die Anzeige: wann die Sperrminute endet
    type: uint32_t
    initial_value: '0'
  - id: frei_ab
    type: std::string

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          #ifdef USE_MQTT
          mqtt::global_mqtt_client->subscribe("${geraet}/cmd/heizkreis", [](const std::string &t, const std::string &p) {
            id(befehl_eingang)->execute(1, p, std::string("MQTT"));
          });
          #endif

script:
  # Schaltwunsch annehmen: ziel 1 Heizkreis, 2 Warmwasser; nutzlast Klartext oder JSON (befehle.h).
  # Nur Buchfuehrung - gesendet wird erst von befehl_pruefen (hoechstens ein Befehl pro Minute).
  - id: befehl_eingang
    mode: queued
    max_runs: 10
    parameters:
      ziel: int
      nutzlast: string
      quelle: string
    then:
      - lambda: |-
          auto &s = bf::schaltung();
          s.uhr = id(uhr).now().is_valid() ? (uint32_t) id(uhr).now().timestamp : 0;
          bf::Anfrage a; a.quelle = quelle;
          std::string f;
          const char *zn = ziel == 1 ? "Heizkreis" : "Warmwasser";
          if (!bf::anfrage_lesen(ziel, nutzlast, a, f)) {
            s.ablehnen(ziel, a, f);
            id(schalt_status).publish_state(a.quelle + ": " + zn + " abgelehnt - " + f);
          } else {
            uint32_t seit = millis() - id(letzter_befehl);
            int warten = id(wem_senden).is_running() ? 60 :
                         (id(letzter_befehl) != 0 && seit < 60000) ? (int) ((60000 - seit) / 1000) + 1 : 0;
            if (ziel == 2 && s.hat_wunsch[1] && warten == 0) warten = 60;   // Heizkreis geht vor
            s.annehmen(ziel, a, warten);
            id(schalt_status).publish_state("vorgemerkt (" + a.quelle + "): " + zn + " " + bf::wert_text(ziel, a.wert) +
                                            (warten > 0 ? ", wird in " + to_string(warten) + " s gesendet" : ""));
          }
      - script.execute: befehl_melden

  # Phasen der Befehle veroeffentlichen (<geraet>/befehl/status, retained) und loggen
  - id: befehl_melden
    mode: queued
    max_runs: 10
    then:
      - lambda: |-
          auto &s = bf::schaltung();
          for (auto &e : s.ereignisse) {
            ESP_LOGI("schalten", "Befehl %s (%s %s): %s%s%s", e.id.c_str(), bf::ziel_name(e.ziel),
                     e.wert ? bf::wert_text(e.ziel, e.wert) : "-", e.phase.c_str(),
                     e.grund.empty() ? "" : " - ", e.grund.c_str());
            #ifdef USE_MQTT
            mqtt::global_mqtt_client->publish("${geraet}/befehl/status", bf::befehl_json(e), 0, true);
            #endif
          }
          if (!s.ereignisse.empty()) bf::status().geaendert = true;
          s.ereignisse.clear();

  # Eintrag ins Schaltprotokoll (neueste zuerst, 10 Eintraege, seit dem letzten Neustart)
  - id: protokoll_eintrag
    mode: queued
    parameters:
      text: string
    then:
      - lambda: |-
          std::string z = id(uhr).now().is_valid() ? id(uhr).now().strftime("%d.%m. %H:%M ") : std::string("");
          auto &p = id(protokoll);
          p.insert(p.begin(), z + text);
          if (p.size() > 10) p.resize(10);
          std::string kurz, lang;
          for (auto &e : p) {
            if (kurz.size() + e.size() + 3 <= 250) { if (!kurz.empty()) kurz += " | "; kurz += e; }
            if (!lang.empty()) lang += "\n";
            lang += e;
          }
          id(schalt_protokoll).publish_state(kurz);
          #ifdef USE_MQTT
          mqtt::global_mqtt_client->publish("${geraet}/schaltprotokoll", lang, 0, true);
          #endif

  # Warteschlange abarbeiten: laeuft jede Sekunde, sendet hoechstens einen Befehl pro Minute
  - id: befehl_pruefen
    mode: single
    then:
      - lambda: |-
          // Anzeige der Warteschlange (nur bei Aenderung veroeffentlichen)
          if (id(letzter_befehl) != id(letzter_gesehen)) {
            id(letzter_gesehen) = id(letzter_befehl);
            auto t = id(uhr).now();
            if (t.is_valid()) { t = ESPTime::from_epoch_local(t.timestamp + 60); id(frei_ab) = t.strftime("%H:%M:%S"); }
            else id(frei_ab) = "";
          }
          auto &s = bf::schaltung();
          s.uhr = id(uhr).now().is_valid() ? (uint32_t) id(uhr).now().timestamp : 0;
          {
            std::string w;
            if (s.hat_wunsch[1]) w = std::string("1. Heizkreis -> ") + bf::hk_text(s.wunsch[1].wert) + " (" + s.wunsch[1].quelle + ")";
            if (s.hat_wunsch[2]) {
              if (!w.empty()) w += " | 2. "; else w = "1. ";
              w += std::string("Warmwasser -> ") + bf::ww_text(s.wunsch[2].wert) + " (" + s.wunsch[2].quelle + ")";
            }
            bool gesperrt = id(wem_senden).is_running() || (id(letzter_befehl) != 0 && millis() - id(letzter_befehl) < 60000);
            if (w.empty()) w = "leer";
            else if (gesperrt) w += id(frei_ab).empty() ? " - wartet auf die Sperrminute" : " - naechster Befehl ab " + id(frei_ab);
            if (id(warteschlange).state != w) id(warteschlange).publish_state(w);
          }
          id(senden) = false;
          if (id(wem_senden).is_running()) return;
          if (id(letzter_befehl) != 0 && millis() - id(letzter_befehl) < 60000) return;
          if (s.laeuft) {                          // Sicherung: WEM-Aufruf fertig, Befehl aber noch offen
            if (id(schalt_ziel) == 0) s.keine_rueckmeldung();
            return;
          }
          bf::Befehl bb;
          if (!s.naechster(bb)) return;
          char b[24];
          if (bb.ziel == 1) snprintf(b, sizeof(b), "0302002533020001%02X", bb.wert);   // MI02 HZK0 Betriebsart
          else              snprintf(b, sizeof(b), "0303002520020001%02X", bb.wert);   // MI03 WW0 Betriebsart
          id(schalt_ziel) = bb.ziel; id(schalt_vg) = b;
          id(letzter_befehl) = millis() | 1; id(eigener_befehl_ms) = id(letzter_befehl);
          bf::status().setze(bf::status().frei_ab, s.uhr ? s.uhr + 60 : 0u);
          id(senden) = true;
      - script.execute: befehl_melden
      - if:
          condition:
            lambda: 'return id(senden);'
          then:
            - script.execute:
                id: wem_senden
                vg: !lambda 'return id(schalt_vg);'

  - id: wem_senden
    mode: single
    parameters:
      vg: string
    then:
      - lambda: |-
          id(pruefen) = false;
          if (id(schalt_ziel) == 1 || id(schalt_ziel) == 2) id(schalt_status).publish_state("sende an WEM ...");
      - http_request.post:
          url: !lambda 'return "http://" + id(wem_ip).state + "/ajax/CanApiJson.json";'
          request_headers:
            Authorization: !lambda |-
              static std::string h;
              std::string up = id(wem_user).state + ":" + id(wem_pass).state;
              h = "Basic " + esphome::base64_encode((const uint8_t *) up.data(), up.size());
              return h.c_str();
            Referer: !lambda |-
              static std::string r;
              r = "http://" + id(wem_ip).state + "/";
              return r.c_str();
            Content-Type: "application/json"
          body: !lambda |-
            return std::string("{\"ID\":\"") + to_string(millis() % 100000000) +
                   "\",\"SRC\":\"DDC\",\"CAPI\":{\"NN\":1,\"N01\":{\"VG\":\"" + vg + "\"}}}";
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            then:
              - lambda: |-
                  size_t p = body.find("\"VG\":\"");
                  std::string rvg = p == std::string::npos ? std::string("") : body.substr(p + 6, body.find('"', p + 6) - p - 6);
                  std::string cm = rvg.size() >= 2 ? rvg.substr(0, 2) : std::string("--");
                  bool ok = response->status_code == 200 && (cm == "04" || cm == "02");
                  std::string zeit = id(uhr).now().is_valid() ? id(uhr).now().strftime("%H:%M ") : std::string("");
                  int ziel = id(schalt_ziel);
                  if (ziel == 3) {
                    std::string t = cm == "04" ? "OK, WEM bestaetigt (VG " + rvg + ")" :
                                    cm == "05" ? "abgelehnt (CM=05): Objekt unbekannt oder nicht schreibbar - VG " + rvg :
                                    "unklare Antwort, HTTP " + to_string(response->status_code) + (rvg.empty() ? "" : ", VG " + rvg);
                    id(schreib_antwort).publish_state(t);
                    id(protokoll_eintrag)->execute("Schreibbefehl " + id(schalt_vg) + ": " + t);
                    id(schalt_ziel) = 0;
                  } else if (ziel == 1 || ziel == 2) {
                    auto &s = bf::schaltung();
                    s.uhr = id(uhr).now().is_valid() ? (uint32_t) id(uhr).now().timestamp : 0;
                    std::string q = s.lauf.quelle;
                    if (cm == "05") {
                      s.wem_antwort(bf::Wem::CM05, "VG " + rvg);
                      id(schalt_status).publish_state(zeit + "abgelehnt (CM=05) - VG " + rvg);
                      id(protokoll_eintrag)->execute(std::string(ziel == 1 ? "Heizkreis" : "Warmwasser") + " (" + q + "): abgelehnt, CM=05");
                      id(schalt_ziel) = 0;
                    } else {
                      s.wem_antwort(ok ? bf::Wem::BESTAETIGT : bf::Wem::UNKLAR,
                                    ok ? std::string("") : "HTTP " + to_string(response->status_code) + (rvg.empty() ? "" : ", VG " + rvg));
                      id(schalt_status).publish_state(ok ? "WEM hat bestaetigt, pruefe am Bus ..." :
                                                           "WEM-Antwort unklar (HTTP " + to_string(response->status_code) + "), pruefe am Bus ...");
                    }
                    id(befehl_melden)->execute();
                  }
          on_error:
            then:
              - lambda: |-
                  std::string zeit = id(uhr).now().is_valid() ? id(uhr).now().strftime("%H:%M ") : std::string("");
                  int ziel = id(schalt_ziel);
                  if (ziel == 3) {
                    id(schreib_antwort).publish_state("WEM nicht erreichbar");
                    id(protokoll_eintrag)->execute("Schreibbefehl " + id(schalt_vg) + ": WEM nicht erreichbar");
                    id(schalt_ziel) = 0;
                  } else if (ziel == 1 || ziel == 2) {
                    auto &s = bf::schaltung();
                    s.uhr = id(uhr).now().is_valid() ? (uint32_t) id(uhr).now().timestamp : 0;
                    s.wem_antwort(bf::Wem::NICHT_ERREICHBAR, "WEM nicht erreichbar");
                    id(schalt_status).publish_state("WEM nicht erreichbar, pruefe trotzdem am Bus ...");
                    id(befehl_melden)->execute();
                  }
      # Der Bus entscheidet, nicht die WEM-Antwort (auch nach einer leeren Antwort
      # wurde schon geschaltet). Nach 3 s das Zielobjekt am Bus lesen.
      - delay: 3s
      - lambda: |-
          if (id(schalt_ziel) != 1 && id(schalt_ziel) != 2) return;
          uint16_t idx = id(schalt_ziel) == 1 ? 0x2933 : 0x2A20;
          id(pruefen) = true;
          bf::status().anlass("schaltbefehl", id(schalt_ziel) == 1, id(schalt_ziel) == 2);
          std::vector<uint8_t> d = {0x40, (uint8_t)(idx & 0xFF), (uint8_t)(idx >> 8), 0x02, 0, 0, 0, 0};
          id(my_can_bus)->send_data(0x601, false, d);
      - delay: 10s
      - lambda: |-
          if (id(schalt_ziel) != 1 && id(schalt_ziel) != 2) return;
          auto &s = bf::schaltung();
          s.uhr = id(uhr).now().is_valid() ? (uint32_t) id(uhr).now().timestamp : 0;
          std::string q = s.lauf.quelle;
          s.keine_rueckmeldung();
          id(schalt_status).publish_state("keine Rueckmeldung vom Bus - Ergebnis unbekannt");
          id(protokoll_eintrag)->execute(std::string(id(schalt_ziel) == 1 ? "Heizkreis" : "Warmwasser") + " (" + q + "): keine Rueckmeldung vom Bus");
          id(schalt_ziel) = 0; id(pruefen) = false;
          id(befehl_melden)->execute();

interval:
  - interval: 1s
    then:
      - script.execute: befehl_pruefen
canbus:
  - id: !extend my_can_bus
    on_frame:
      - can_id: 0x581
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40 || x[3] != 2 || ((x[2] << 8) | x[1]) != 0x2933) return;
              uint8_t b = x[4];
              static const char* n[] = {"?", "Standby", "Zeitprogramm 1", "Zeitprogramm 2", "Zeitprogramm 3", "Sommer", "Komfort", "Normal", "Absenk"};
              if (b >= 1 && b <= 8) id(hk_setzen).publish_state(n[b]);
              if (id(schalt_ziel) != 1 || !id(pruefen)) return;
              auto &s = bf::schaltung();
              s.uhr = id(uhr).now().is_valid() ? (uint32_t) id(uhr).now().timestamp : 0;
              int soll = s.lauf.wert; std::string q = s.lauf.quelle;
              s.bus_wert(1, b);
              std::string zeit = id(uhr).now().is_valid() ? id(uhr).now().strftime("%H:%M:%S ") : std::string("");
              bool ok = b == soll;
              std::string ist = b <= 8 ? n[b] : "?";
              id(schalt_status).publish_state(zeit + (ok ? "OK: Heizkreis steht auf " + ist : "NICHT uebernommen, Heizkreis steht auf " + ist));
              id(protokoll_eintrag)->execute("Heizkreis -> " + std::string(bf::hk_text(soll)) + " (" + q + "): " + (ok ? "ok" : "NICHT uebernommen, steht auf " + ist));
              id(schalt_ziel) = 0; id(pruefen) = false;
              id(befehl_melden)->execute();

select:
  - platform: template
    name: "Heizkreis Betriebsart setzen"
    id: hk_setzen
    options: ["Standby", "Zeitprogramm 1", "Zeitprogramm 2", "Zeitprogramm 3", "Sommer", "Komfort", "Normal", "Absenk"]
    optimistic: false
    web_server: { sorting_group_id: g_schalten, sorting_weight: 1 }
    set_action:
      - script.execute:
          id: befehl_eingang
          ziel: 1
          nutzlast: !lambda 'return x;'
          quelle: "Web/HA"
      - script.execute: befehl_pruefen

button:
  - platform: template
    name: "Schreiben"
    web_server: { sorting_group_id: g_schreiben, sorting_weight: 2 }
    on_press:
      - lambda: |-
          id(senden) = false;
          if (id(wem_senden).is_running() || (id(letzter_befehl) != 0 && millis() - id(letzter_befehl) < 60000)) {
            id(schreib_antwort).publish_state("bitte warten - hoechstens ein Befehl pro Minute"); return;
          }
          // Format: MI MX OX OS WERT (hex), z.B. "03 00 2520 02 02" = Warmwasser Aus
          unsigned mi = 0, mx = 0, ox = 0, os = 0; char w[12] = {0};
          if (sscanf(id(schreib_eingabe).state.c_str(), "%x %x %x %x %10s", &mi, &mx, &ox, &os, w) != 5 ||
              mx > 0xFF || ox > 0xFFFF || os > 0xFF) {
            id(schreib_antwort).publish_state("ungueltig - Format: MI MX OX OS WERT, z.B. 03 00 2520 02 02"); return;
          }
          if (mi != 1 && mi != 2 && mi != 3) {   // nur Systemgeraet: SYSTEM0, HZK0, WW0 - nie der Kessel
            id(schreib_antwort).publish_state("gesperrt: nur MI 01, 02, 03 erlaubt - der Kessel wird nie beschrieben"); return;
          }
          std::string v = w;
          if (v.empty() || v.size() > 4 || v.find_first_not_of("0123456789abcdefABCDEF") != std::string::npos) {
            id(schreib_antwort).publish_state("Wert: 1-4 Hexziffern"); return;
          }
          if (v.size() % 2) v = "0" + v;
          char b[40];
          snprintf(b, sizeof(b), "03%02X%02X%04X%02X%04X%s", mi, mx, ox, os, (unsigned) (v.size() / 2), v.c_str());
          id(schalt_vg) = b; id(schalt_ziel) = 3;
          id(letzter_befehl) = millis() | 1; id(eigener_befehl_ms) = id(letzter_befehl); id(senden) = true;
          if (id(uhr).now().is_valid()) bf::status().setze(bf::status().frei_ab, (uint32_t) id(uhr).now().timestamp + 60);
          id(schreib_antwort).publish_state(std::string("sende VG ") + b + " ...");
      - if:
          condition:
            lambda: 'return id(senden);'
          then:
            - script.execute:
                id: wem_senden
                vg: !lambda 'return id(schalt_vg);'
  - platform: template
    name: "Warteschlange leeren"
    web_server: { sorting_group_id: g_schalten, sorting_weight: 5 }
    on_press:
      - lambda: |-
          auto &s = bf::schaltung();
          s.uhr = id(uhr).now().is_valid() ? (uint32_t) id(uhr).now().timestamp : 0;
          if (s.leeren() == 0) return;
          id(schalt_status).publish_state("Warteschlange geleert");
          id(protokoll_eintrag)->execute(std::string("Warteschlange von Hand geleert"));
      - script.execute: befehl_melden
text:
  - platform: template
    name: "Heizung: IP-Adresse"
    id: wem_ip
    optimistic: true
    restore_value: true
    initial_value: !secret wem_ip
    mode: text
    max_length: 40
    web_server: { sorting_group_id: g_einst, sorting_weight: 1 }
  - platform: template
    name: "WEM-Benutzer"
    id: wem_user
    optimistic: true
    internal: true           # Weishaupt ab Werk, laut Anleitung nicht aenderbar
    initial_value: !secret wem_user
    mode: text
    max_length: 32
  - platform: template
    name: "WEM-Passwort"
    id: wem_pass
    optimistic: true
    internal: true
    initial_value: !secret wem_pass
    mode: password
    max_length: 32
  - platform: template
    name: "Schreibbefehl (MI MX OX OS WERT hex)"
    id: schreib_eingabe
    optimistic: true
    mode: text
    max_length: 32
    web_server: { sorting_group_id: g_schreiben, sorting_weight: 1 }

text_sensor:
  - platform: template
    name: "Ergebnis letzter Schaltbefehl"
    id: schalt_status
    web_server: { sorting_group_id: g_schalten, sorting_weight: 4 }
  - platform: template
    name: "Warteschlange"
    id: warteschlange
    web_server: { sorting_group_id: g_schalten, sorting_weight: 3 }
  - platform: template
    name: "Schaltprotokoll"
    id: schalt_protokoll
    web_server: { sorting_group_id: g_schalten, sorting_weight: 6 }
  - platform: template
    name: "Schreibbefehl Antwort"
    id: schreib_antwort
    web_server: { sorting_group_id: g_schreiben, sorting_weight: 3 }

