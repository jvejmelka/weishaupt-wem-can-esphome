# Paket WEM-SCHALTEN: Heizkreis-Betriebsart am WEM schalten, Kontrolle danach am CAN-Bus.
# Zwei Wege: per CAN direkt an den WEM (Knoten 1; ab v35, seit v42 ab Werk AN) oder ueber die
# WEM-JSON-Schnittstelle (http://<WEM>/ajax/CanApiJson.json; Rueckweg, bis v34 der einzige Weg).
# Braucht das Paket kessel. In den Kessel (Knoten 2) wird NIE geschrieben.
#
# Schalter auf dem Board, Gruppe "Schreiben per CAN" (ab v35):
#   - "Schalten per CAN statt JSON": Heizkreis/Warmwasser per SDO-Download an den WEM
#     (0x2933/2, 0x2A20/2), sonst alles wie beim JSON-Weg (Warteschlange, Mindestabstand, Kontrolle).
#   - "Freies CAN-Schreiben (Experten)": Eingabefeld und ${geraet}/cmd/can_schreiben,
#     "KN IDX SUB WERT [LAENGE]" oder "KN IDX SUB = B1 B2 ..." (hex), nur 2000-5FFF, ab Werk nur Knoten 01 (WEM).
#   - "Freies CAN-Schreiben: erlaubte Knoten" (ab v42): Liste der Knoten, an die das freie CAN-Schreiben
#     senden darf, hex, z. B. "01 04" (WEM und ein Raumgeraet). Ab Werk "01". Knoten 02 (Kessel) und 00
#     lassen sich nicht eintragen. Gesendet wird erst, wenn der SDO-Kanal des Knotens 200 ms lang still war.
#   An einer WTC-GW 15-B (WEM 428.226) bestaetigt; andere Anlagen: auf eigene Gefahr.
#
# Warum so vorsichtig: die JSON-Schnittstelle des WEM ist empfindlich. Regelmaessiges
# Abfragen hat sie mehrfach dauerhaft lahmgelegt (nur Stromlos-Machen half), und jede
# Anfrage an ein Objekt, das die Anlage nicht hat (Antwort CM=05), verbraucht einen von
# nur zehn Plaetzen bis zum naechsten Neustart der Heizung. Deshalb:
#   - Mindestabstand zwischen zwei Befehlen, ueber JSON ab Werk 60 s und nicht kuerzer einstellbar
#     (per CAN ab Werk 10 s; Warteschlange: der NEUESTE Wunsch je Ziel gewinnt)
#   - geschrieben wird nur MI 01/02/03 (Systemgeraet), nie der Kessel
#   - eine CM=05-Antwort wird im Ergebnis gemeldet
#   - die JSON-Schnittstelle wird nie von selbst aufgerufen, nur auf Bedienung
#
# Schreibschutz (ab v42): jeder geaenderte Wert landet vermutlich im EEPROM des WEM (fuer die Systemgeraete
# der Waermepumpen nennt Weishaupt 100.000 Schreibzugriffe ueber die Lebensdauer). Deshalb:
#   - Vorab-Lesung (Skript vorab_lesen): vor dem Schalten den Wert am WEM lesen; steht er schon so, nicht schreiben
#   - Schreibzaehler: "Schreibvorgaenge letzte Stunde" und "Schreibvorgaenge gesamt" (gesamt gespeichert)
#   - Obergrenze: "Schreibvorgaenge je Stunde hoechstens" (Vorgabe 30) - darueber wird nicht gesendet
#   Gezaehlt wird jedes Schreiben des Boards am WEM: Schalten (CAN und JSON), freies CAN-Schreiben,
#   Schreibfeld, Warmwasser-Push (kraiz-per-can). PROTOKOLL.md, "Schreibschutz".
#
# Schalten per MQTT (braucht Paket mqtt):
#   ${geraet}/cmd/heizkreis   Klartext "1".."8", Name ("Zeitprogramm 1", "Standby") oder Kurzform "ZP1"
#                             oder JSON {"id":17,"wert":"ZP2","quelle":"App"} (id und quelle optional)
#   ${geraet}/befehl/status   (retained) JSON je Phase eines Befehls - siehe TOPICS.md:
#                             angenommen -> vorgemerkt -> gesendet -> pruefe_bus -> bestaetigt | gescheitert
#                             ab v42 auch: vorgemerkt -> bestaetigt (stand schon so, nichts geschrieben)
#                                          vorgemerkt -> gescheitert (obergrenze je Stunde erreicht)
#   ${geraet}/schaltprotokoll (retained) die letzten 10 Befehle, einer je Zeile (VERALTET, Klartext)
# Die Buchfuehrung (Warteschlange, Phasen, JSON) steht in befehle.h (getestet in tests/).

# Vorgabe; ueberschrieben wird in der Hauptdatei unter substitutions:
#   abstand_can_min   kleinster einstellbarer Abstand zwischen zwei Befehlen per CAN in Sekunden (Vorgabe 5).
#                     Kleiner nur fuer Versuche an einem Tisch-Aufbau - an der Anlage bei 5 lassen.
substitutions:
  abstand_can_min: "5"

web_server:
  sorting_groups:
    - id: g_schalten
      name: "Schalten (ueber WEM, Kontrolle am Bus)"
      sorting_weight: 5
    - id: g_schreiben
      name: "Schreibbefehl ueber WEM (Experten)"
      sorting_weight: 45
    - id: g_can_schreiben
      name: "Schreiben per CAN"
      sorting_weight: 46
    - id: g_sd
      name: "SD-Karte des WEM (Dateien lesen)"
      sorting_weight: 47

globals:
  - id: sd_ok
    type: bool
    initial_value: 'false'

http_request:
  timeout: 10s
  verify_ssl: false

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          #ifdef USE_MQTT
          mqtt::global_mqtt_client->subscribe("${geraet}/cmd/heizkreis", [](const std::string &t, const std::string &p) {
            id(befehl_eingang)->execute(1, p, std::string("MQTT"));
          });
          mqtt::global_mqtt_client->subscribe("${geraet}/cmd/can_schreiben", [](const std::string &t, const std::string &p) {
            id(can_frei_senden)->execute(p);
          });
          mqtt::global_mqtt_client->subscribe("${geraet}/cmd/sd_datei", [](const std::string &t, const std::string &p) {
            id(sd_holen)->execute(p);
          });
          #endif

script:
  # Schaltwunsch annehmen: ziel 1 Heizkreis, 2 Warmwasser; nutzlast Klartext oder JSON (befehle.h).
  # Nur Buchfuehrung - gesendet wird erst von befehl_pruefen (Mindestabstand zwischen zwei Befehlen).
  - id: befehl_eingang
    mode: queued
    max_runs: 10
    parameters:
      ziel: int
      nutzlast: string
      quelle: string
    then:
      - lambda: |-
          auto &s = bf::schaltung();
          s.uhr = id(wcan)->unix_zeit();
          bf::Anfrage a; a.quelle = quelle;
          std::string f;
          const char *zn = ziel == 1 ? "Heizkreis" : "Warmwasser";
          if (!bf::anfrage_lesen(ziel, nutzlast, a, f)) {
            s.ablehnen(ziel, a, f);
            id(schalt_status).publish_state(a.quelle + ": " + zn + " abgelehnt - " + f);
          } else {
            int warten = id(wcan)->schalten.warten_s(millis(), id(vorab_lesen).is_running() || id(wem_senden).is_running() || id(can_senden).is_running() ||
                                                              id(can_frei_senden).is_running() || id(sd_holen).is_running());
            // ein frueher eingegangener Wunsch fuer das andere Ziel wird zuerst gesendet (Reihenfolge des Eingangs)
            if (warten == 0 && s.hat_wunsch[ziel == 1 ? 2 : 1]) warten = (int) id(wcan)->schalten.sperre_s();
            s.annehmen(ziel, a, warten);
            id(schalt_status).publish_state("vorgemerkt (" + a.quelle + "): " + zn + " " + bf::wert_text(ziel, a.wert) +
                                            (warten > 0 ? ", wird in " + to_string(warten) + " s gesendet" : ""));
          }
      - script.execute: befehl_melden

  # Phasen der Befehle veroeffentlichen (<geraet>/befehl/status, retained) und loggen
  - id: befehl_melden
    mode: queued
    max_runs: 10
    then:
      - lambda: |-
          auto &s = bf::schaltung();
          for (auto &e : s.ereignisse) {
            ESP_LOGI("schalten", "Befehl %s (%s %s): %s%s%s", e.id.c_str(), bf::ziel_name(e.ziel),
                     e.wert ? bf::wert_text(e.ziel, e.wert) : "-", e.phase.c_str(),
                     e.grund.empty() ? "" : " - ", e.grund.c_str());
            #ifdef USE_MQTT
            mqtt::global_mqtt_client->publish("${geraet}/befehl/status", bf::befehl_json(e), 0, true);
            #endif
            #ifdef USE_WC_APP
            ap::befehl_merken(e);   // Verlauf fuer /api/status der App auf dem Board
            #endif
          }
          if (!s.ereignisse.empty()) bf::status().geaendert = true;
          s.ereignisse.clear();

  # Eintrag ins Schaltprotokoll (neueste zuerst, 10 Eintraege, seit dem letzten Neustart)
  - id: protokoll_eintrag
    mode: queued
    parameters:
      text: string
    then:
      - lambda: |-
          auto &p = id(wcan)->schalten.protokoll;
          p.neu(id(wcan)->zeit("%d.%m. %H:%M ") + text);
          id(schalt_protokoll).publish_state(p.kurz());
          #ifdef USE_MQTT
          mqtt::global_mqtt_client->publish("${geraet}/schaltprotokoll", p.lang(), 0, true);
          #endif

  # Warteschlange abarbeiten: laeuft jede Sekunde, sendet erst nach dem Mindestabstand (abstand_can bzw. abstand_json)
  - id: befehl_pruefen
    mode: single
    then:
      - lambda: |-
          auto &sc = id(wcan)->schalten;
          // Anzeige der Warteschlange (nur bei Aenderung veroeffentlichen)
          if (sc.letzter_befehl != sc.letzter_gesehen) {
            sc.letzter_gesehen = sc.letzter_befehl;
            auto t = id(uhr).now();
            if (t.is_valid()) { t = ESPTime::from_epoch_local(t.timestamp + sc.sperre_s()); sc.frei_ab = t.strftime("%H:%M:%S"); }
            else sc.frei_ab = "";
          }
          bf::status().setze(bf::status().weg_can, (bool) id(can_schalten).state);   // fuer status/json und App
          // Schreibzaehler anzeigen (nur bei Aenderung); raeumt dabei Eintraege aelter als 1 h weg
          { int n = sc.schreib_stunde(millis());
            if (id(schreib_stunde_s).state != (float) n) id(schreib_stunde_s).publish_state(n);
            if (id(schreib_gesamt_s).state != (float) sc.schreib_gesamt) id(schreib_gesamt_s).publish_state(sc.schreib_gesamt); }
          auto &s = bf::schaltung();
          s.uhr = id(wcan)->unix_zeit();
          std::string w = wc::warteschlange_text(s, (id(vorab_lesen).is_running() || id(wem_senden).is_running() || id(can_senden).is_running() || id(can_frei_senden).is_running() || id(sd_holen).is_running()) || sc.sperrminute(millis()), sc.frei_ab);
          if (id(warteschlange).state != w) id(warteschlange).publish_state(w);
          sc.senden = false;
          if ((id(vorab_lesen).is_running() || id(wem_senden).is_running() || id(can_senden).is_running() || id(can_frei_senden).is_running() || id(sd_holen).is_running())) return;
          if (sc.sperrminute(millis())) return;
          if (s.laeuft) {                          // Sicherung: WEM-Aufruf fertig, Befehl aber noch offen
            if (sc.ziel == 0) s.keine_rueckmeldung();
            return;
          }
          bf::Befehl bb;
          if (!s.naechster(bb, false)) return;   // "gesendet" meldet erst vorab_lesen, wenn wirklich geschrieben wird
          char b[24];
          // VG: CM 03, MI MX OX OS VS, Wert - z.B. 0302002533020001 + Wert (register.yaml)
          if (bb.ziel == 1) reg::json_vg_schreiben(b, sizeof(b), reg::HK_BETRIEBSART_JSON, bb.wert);   // MI02 HZK0 Betriebsart
          else              reg::json_vg_schreiben(b, sizeof(b), reg::WW_BETRIEBSART_JSON, bb.wert);   // MI03 WW0 Betriebsart
          sc.ziel = bb.ziel; sc.vg = b;
          // Abstand zum naechsten Befehl: per CAN kurz, ueber die JSON-Schnittstelle mindestens 1 min
          sc.beginnen(millis(), (uint32_t) (id(can_schalten).state ? id(abstand_can).state : id(abstand_json).state) * 1000);
          id(wcan)->anlass.eigener_befehl_ms = sc.letzter_befehl;
          bf::status().setze(bf::status().frei_ab, s.uhr ? s.uhr + sc.sperre_s() : 0u);
          sc.senden = true;
      - if:
          condition:
            lambda: 'return id(wcan)->schalten.senden;'
          then:
            - script.execute: vorab_lesen

  # Vor dem Schreiben lesen (ab v42): die Betriebsart wird einmal per SDO am WEM gelesen. Steht sie schon auf dem
  # gewuenschten Wert, wird NICHT geschrieben (Befehl "bestaetigt", Text "stand schon so") - jeder geaenderte Wert
  # landet vermutlich im EEPROM des WEM. Sonst, oder ohne Antwort binnen 1 s (Bus tot, kein CAN-Kabel), wird wie
  # bisher geschrieben - sofern die Obergrenze "Schreibvorgaenge je Stunde" es erlaubt (sonst "gescheitert", Grund
  # obergrenze). Die Antwort faengt on_frame 0x581 (unten und in warmwasser-schalten.yaml).
  - id: vorab_lesen
    mode: single
    then:
      - lambda: |-
          auto &sc = id(wcan)->schalten;
          sc.vorab = false; sc.vorab_ist = -1; sc.weiter = false;
          if (sc.ziel != 1 && sc.ziel != 2) return;
          if (id(wcan)->bus.tot(millis())) return;            // ohne Bus keine Vorab-Lesung
          const reg::Sdo &o = sc.ziel == 1 ? reg::HK_BETRIEBSART : reg::WW_BETRIEBSART;
          sc.vorab = true;
          std::vector<uint8_t> d = reg::lese(o);
          id(wcan)->senden(reg::anfrage_id(o), d);
      - wait_until:
          condition:
            lambda: 'return !id(wcan)->schalten.vorab;'
          timeout: 1s
      - lambda: |-
          auto &sc = id(wcan)->schalten;
          sc.vorab = false;
          int ziel = sc.ziel;
          if (ziel != 1 && ziel != 2) return;
          auto &s = bf::schaltung();
          s.uhr = id(wcan)->unix_zeit();
          std::string zn = ziel == 1 ? "Heizkreis" : "Warmwasser";
          std::string q = s.lauf.quelle;
          std::string soll = bf::wert_text(ziel, s.lauf.wert);
          std::string t;
          if (sc.vorab_ist == s.lauf.wert) {
            s.schon_so(sc.vorab_ist);
            id(schalt_status).publish_state(id(wcan)->zeit("%H:%M:%S ") + "OK: " + zn + " stand schon auf " + soll + " - nicht geschrieben");
            id(protokoll_eintrag)->execute(zn + " -> " + soll + " (" + q + "): stand schon so, nicht geschrieben");
            sc.ziel = 0;
          } else if (!sc.schreib_buchen(millis(), (int) id(schreib_max).state, t)) {
            s.obergrenze(t);
            id(schalt_status).publish_state(id(wcan)->zeit("%H:%M:%S ") + zn + " -> " + soll + ": " + t);
            id(protokoll_eintrag)->execute(zn + " -> " + soll + " (" + q + "): " + t);
            sc.ziel = 0;
          } else {
            s.gesendet();
            sc.weiter = true;
          }
          id(befehl_melden)->execute();
      - if:
          condition:
            lambda: 'return id(wcan)->schalten.weiter && id(can_schalten).state;'
          then:
            - script.execute: can_senden
          else:
            - if:
                condition:
                  lambda: 'return id(wcan)->schalten.weiter;'
                then:
                  - script.execute:
                      id: wem_senden
                      vg: !lambda 'return id(wcan)->schalten.vg;'

  # Schalten per CAN (ab v35, Schalter, seit v42 ab Werk an): Betriebsart per SDO-Download an den WEM
  # (Knoten 1, 0x2933/2 bzw. 0x2A20/2, 1 Byte). Antwort 0x60 = bestaetigt, 0x80 = abgelehnt.
  # Danach wie beim JSON-Weg: der Bus entscheidet (Kontroll-Lesung nach 3 s).
  - id: can_senden
    mode: single
    then:
      - lambda: |-
          auto &sc = id(wcan)->schalten;
          const reg::Sdo &o = sc.ziel == 1 ? reg::HK_BETRIEBSART : reg::WW_BETRIEBSART;
          wc::CanSchreibbefehl c; c.kn = o.knoten; c.idx = o.index; c.sub = o.sub;
          c.daten = {(uint8_t) bf::schaltung().lauf.wert};
          sc.pruefen = false; sc.can_fertig = false; sc.can_text.clear();
          uint32_t cid = 0; std::vector<uint8_t> d;
          id(wcan)->schreiben.starten(c, cid, d);
          id(schalt_status).publish_state("sende per CAN an WEM ...");
          id(wcan)->senden(cid, d);
      - delay: 1s
      - lambda: |-
          auto &sc = id(wcan)->schalten;
          int ziel = sc.ziel;
          if (ziel != 1 && ziel != 2) return;
          auto &s = bf::schaltung();
          s.uhr = id(wcan)->unix_zeit();
          std::string q = s.lauf.quelle;
          ESP_LOGI("schalten", "CAN: %s | roh: %s", sc.can_text.c_str(), id(wcan)->schreiben.roh.c_str());
          if (sc.can_fertig && id(wcan)->schreiben.ok) {
            s.wem_antwort(bf::Wem::BESTAETIGT, "");
            id(schalt_status).publish_state("WEM hat per CAN bestaetigt, pruefe am Bus ...");
          } else if (sc.can_fertig) {
            s.wem_antwort(bf::Wem::CM05, "CAN: " + sc.can_text);
            id(schalt_status).publish_state(id(wcan)->zeit("%H:%M ") + "per CAN " + sc.can_text);
            id(protokoll_eintrag)->execute(std::string(ziel == 1 ? "Heizkreis" : "Warmwasser") + " (" + q + "): per CAN " + sc.can_text);
            sc.ziel = 0;
          } else {
            id(wcan)->schreiben.aktiv = false;
            s.wem_antwort(bf::Wem::NICHT_ERREICHBAR, "CAN: keine Antwort vom WEM");
            id(schalt_status).publish_state("keine CAN-Antwort vom WEM, pruefe trotzdem am Bus ...");
          }
          id(befehl_melden)->execute();
      - delay: 2s
      - script.execute: bus_kontrolle
      - script.wait: bus_kontrolle

  # Freies CAN-Schreiben (ab v35, Schalter "Experten", ab Werk aus): Eingabefeld oder cmd/can_schreiben.
  # Nur Objekte 2000-5FFF, nur freigeschaltete Knoten (ab Werk nur 01 = WEM, nie 02 = Kessel; wc::can_schreib_lesen),
  # Mindestabstand wie beim Schalten per CAN. Ab v42: gesendet wird in einer Pause des SDO-Verkehrs mit dem Knoten
  # (200 ms still, sonst nach 3 s Abbruch) - ein fremder Auftrag in Teilstuecken wird so nicht unterbrochen.
  - id: can_frei_senden
    mode: queued
    max_runs: 5
    parameters:
      eingabe: string
    then:
      - lambda: |-
          auto &sc = id(wcan)->schalten;
          sc.can_frei_gesendet = false; sc.can_frei_wartet = false;
          if (!id(can_frei).state) { id(can_antwort).publish_state("gesperrt - Schalter \"Freies CAN-Schreiben\" ist aus"); return; }
          if (id(vorab_lesen).is_running() || id(wem_senden).is_running() || id(can_senden).is_running() || sc.sperrminute(millis())) {
            id(can_antwort).publish_state("bitte warten - Abstand zum letzten Befehl"); return;
          }
          if (id(wcan)->bus.tot(millis())) { id(can_antwort).publish_state("Bus tot - nicht gesendet"); return; }
          wc::KnotenFreigabe frei; std::string f;
          if (!wc::knoten_freigabe_lesen(id(can_frei_knoten).state, frei, f)) {
            id(can_antwort).publish_state("erlaubte Knoten: " + f + " - nicht gesendet"); return;
          }
          wc::CanSchreibbefehl c;
          if (!wc::can_schreib_lesen(eingabe, c, f, frei)) { id(can_antwort).publish_state(f); return; }
          id(wcan)->frei_befehl = c;
          sc.can_frei_wartet = true;
      - if:
          condition:
            lambda: 'return id(wcan)->schalten.can_frei_wartet;'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(wcan)->sdo_ruhig(id(wcan)->frei_befehl.kn, millis());'
                timeout: 3s
            - lambda: |-
                auto &sc = id(wcan)->schalten;
                const wc::CanSchreibbefehl &c = id(wcan)->frei_befehl;
                sc.can_frei_wartet = false;
                if (!id(can_frei).state) { id(can_antwort).publish_state("gesperrt - Schalter \"Freies CAN-Schreiben\" ist aus"); return; }
                if (!id(wcan)->sdo_ruhig(c.kn, millis())) {
                  id(can_antwort).publish_state(str_sprintf("Knoten %02X: SDO-Kanal 3 s lang belegt - nicht gesendet", c.kn)); return;
                }
                std::string og;
                if (!sc.schreib_buchen(millis(), (int) id(schreib_max).state, og)) { id(can_antwort).publish_state(og); return; }
                sc.beginnen(millis(), (uint32_t) id(abstand_can).state * 1000); id(wcan)->anlass.eigener_befehl_ms = sc.letzter_befehl;
                uint32_t u = id(wcan)->unix_zeit();
                if (u != 0) bf::status().setze(bf::status().frei_ab, u + sc.sperre_s());
                uint32_t cid = 0; std::vector<uint8_t> d;
                sc.can_fertig = false; sc.can_text.clear();
                id(wcan)->schreiben.starten(c, cid, d);
                id(can_antwort).publish_state("gesendet, warte ...");
                ESP_LOGW("schreiben", "CAN-Schreibbefehl %s", eingabe.c_str());
                id(wcan)->senden(cid, d);
                sc.can_frei_gesendet = true;
      - if:
          condition:
            lambda: 'return id(wcan)->schalten.can_frei_gesendet;'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(wcan)->schalten.can_fertig;'
                timeout: 2s
            - lambda: |-
                auto &sc = id(wcan)->schalten;
                auto &w = id(wcan)->schreiben;
                sc.can_frei_gesendet = false;
                std::string t = sc.can_fertig ? sc.can_text : str_sprintf("keine Antwort von Knoten %02X", w.kn);
                if (!sc.can_fertig) w.aktiv = false;
                id(can_antwort).publish_state(t);
                id(can_roh).publish_state(w.roh);
                id(protokoll_eintrag)->execute("CAN-Schreibbefehl: " + t);
                ESP_LOGI("schreiben", "%s | roh: %s", t.c_str(), w.roh.c_str());

  # Datei von der SD-Karte des WEM holen (ab v36): einmal pro Aufruf, Mindestabstand wie beim Schalten ueber JSON
  # (die Weboberflaeche des WEM ist empfindlich - nie im Takt). Inhalt per MQTT an
  # ${geraet}/sd/<datei> (ab 4 KB in Stuecken <datei>/1, /2 ...), der Anfang in der Weboberflaeche;
  # systable.csv wird zusaetzlich ausgewertet (Knoten, Firmware, Module).
  - id: sd_holen
    mode: single
    parameters:
      name: string
    then:
      - lambda: |-
          id(sd_ok) = false;
          auto &sc = id(wcan)->schalten;
          if (!id(sd_erlaubt).state) { id(sd_antwort).publish_state("gesperrt - Schalter \"SD-Dateien abrufen\" ist aus"); return; }
          if (!wc::sd_name_ok(name)) { id(sd_antwort).publish_state("ungueltiger Dateiname (nur Buchstaben, Ziffern, _ . -)"); return; }
          if (id(vorab_lesen).is_running() || id(wem_senden).is_running() || id(can_senden).is_running() || id(can_frei_senden).is_running() || sc.sperrminute(millis())) {
            id(sd_antwort).publish_state("bitte warten - Abstand zum letzten WEM-Zugriff"); return;
          }
          sc.beginnen(millis(), (uint32_t) id(abstand_json).state * 1000);   // HTTP an den WEM wie JSON
          uint32_t u = id(wcan)->unix_zeit();
          if (u != 0) bf::status().setze(bf::status().frei_ab, u + sc.sperre_s());
          id(sd_antwort).publish_state("hole " + name + " ...");
          id(sd_ok) = true;
      - if:
          condition:
            lambda: 'return id(sd_ok);'
          then:
            - http_request.get:
                url: !lambda 'return "http://" + id(wem_ip).state + "/sd/" + name;'
                request_headers:
                  Authorization: !lambda |-
                    static std::string h;
                    std::string up = id(wem_user).state + ":" + id(wem_pass).state;
                    h = "Basic " + esphome::base64_encode((const uint8_t *) up.data(), up.size());
                    return h.c_str();
                capture_response: true
                max_response_buffer_size: 16384
                on_response:
                  then:
                    - lambda: |-
                        int code = response->status_code;
                        std::string t = name + ": HTTP " + to_string(code) + ", " + to_string(body.size()) + " Byte";
                        if (body.size() >= 16384) t += " (bei 16 KB abgeschnitten)";
                        #ifdef USE_MQTT
                        if (code == 200) {
                          std::string basis = "${geraet}/sd/" + name;
                          if (body.size() <= 4096) {
                            mqtt::global_mqtt_client->publish(basis, body, 0, false);
                          } else {
                            int n = 0;
                            for (size_t i = 0; i < body.size(); i += 4096)
                              mqtt::global_mqtt_client->publish(basis + "/" + to_string(++n), body.substr(i, 4096), 0, false);
                            t += ", MQTT in " + to_string(n) + " Stuecken";
                          }
                        }
                        #endif
                        id(sd_antwort).publish_state(t);
                        id(sd_inhalt).publish_state(code == 200 ? body.substr(0, 1000) : std::string(""));
                        std::string kl = name;
                        for (auto &c : kl) c = tolower(c);
                        if (code == 200 && kl == "systable.csv") id(systabelle).publish_state(wc::systabelle_text(body));
                        ESP_LOGI("sd", "%s", t.c_str());
                on_error:
                  then:
                    - lambda: 'id(sd_antwort).publish_state(name + ": WEM nicht erreichbar");'

  # Kontrolle am Bus nach einem Schaltbefehl (JSON oder CAN): der Bus entscheidet, nicht die
  # Antwort (auch nach einer leeren JSON-Antwort wurde schon geschaltet).
  - id: bus_kontrolle
    mode: single
    then:
      - lambda: |-
          if (id(wcan)->schalten.ziel != 1 && id(wcan)->schalten.ziel != 2) return;
          const reg::Sdo &ziel = id(wcan)->schalten.ziel == 1 ? reg::HK_BETRIEBSART : reg::WW_BETRIEBSART;
          id(wcan)->schalten.pruefen = true;
          bf::status().anlass("schaltbefehl", id(wcan)->schalten.ziel == 1, id(wcan)->schalten.ziel == 2);
          std::vector<uint8_t> d = reg::lese(ziel);
          id(wcan)->senden(reg::anfrage_id(ziel), d);
      - delay: 10s
      - lambda: |-
          if (id(wcan)->schalten.ziel != 1 && id(wcan)->schalten.ziel != 2) return;
          auto &s = bf::schaltung();
          s.uhr = id(wcan)->unix_zeit();
          std::string q = s.lauf.quelle;
          s.keine_rueckmeldung();
          id(schalt_status).publish_state("keine Rueckmeldung vom Bus - Ergebnis unbekannt");
          id(protokoll_eintrag)->execute(std::string(id(wcan)->schalten.ziel == 1 ? "Heizkreis" : "Warmwasser") + " (" + q + "): keine Rueckmeldung vom Bus");
          id(wcan)->schalten.ziel = 0; id(wcan)->schalten.pruefen = false;
          id(befehl_melden)->execute();

  - id: wem_senden
    mode: single
    parameters:
      vg: string
    then:
      - lambda: |-
          id(wcan)->schalten.pruefen = false;
          if (id(wcan)->schalten.ziel == 1 || id(wcan)->schalten.ziel == 2) id(schalt_status).publish_state("sende an WEM ...");
      - http_request.post:
          url: !lambda 'return "http://" + id(wem_ip).state + "/ajax/CanApiJson.json";'
          request_headers:
            Authorization: !lambda |-
              static std::string h;
              std::string up = id(wem_user).state + ":" + id(wem_pass).state;
              h = "Basic " + esphome::base64_encode((const uint8_t *) up.data(), up.size());
              return h.c_str();
            Referer: !lambda |-
              static std::string r;
              r = "http://" + id(wem_ip).state + "/";
              return r.c_str();
            Content-Type: "application/json"
          body: !lambda 'return wc::wem_rumpf(millis(), vg);'
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            then:
              - lambda: |-
                  std::string rvg = wc::wem_vg(body);
                  std::string cm = rvg.size() >= 2 ? rvg.substr(0, 2) : std::string("--");
                  bool ok = response->status_code == 200 && (cm == "04" || cm == "02");
                  std::string zeit = id(wcan)->zeit("%H:%M ");
                  int ziel = id(wcan)->schalten.ziel;
                  if (ziel == 3) {
                    std::string t = cm == "04" ? "OK, WEM bestaetigt (VG " + rvg + ")" :
                                    cm == "05" ? "abgelehnt (CM=05): Objekt unbekannt oder nicht schreibbar - VG " + rvg :
                                    "unklare Antwort, HTTP " + to_string(response->status_code) + (rvg.empty() ? "" : ", VG " + rvg);
                    id(schreib_antwort).publish_state(t);
                    id(protokoll_eintrag)->execute("Schreibbefehl " + id(wcan)->schalten.vg + ": " + t);
                    id(wcan)->schalten.ziel = 0;
                  } else if (ziel == 1 || ziel == 2) {
                    auto &s = bf::schaltung();
                    s.uhr = id(wcan)->unix_zeit();
                    std::string q = s.lauf.quelle;
                    if (cm == "05") {
                      s.wem_antwort(bf::Wem::CM05, "VG " + rvg);
                      id(schalt_status).publish_state(zeit + "abgelehnt (CM=05) - VG " + rvg);
                      id(protokoll_eintrag)->execute(std::string(ziel == 1 ? "Heizkreis" : "Warmwasser") + " (" + q + "): abgelehnt, CM=05");
                      id(wcan)->schalten.ziel = 0;
                    } else {
                      s.wem_antwort(ok ? bf::Wem::BESTAETIGT : bf::Wem::UNKLAR,
                                    ok ? std::string("") : "HTTP " + to_string(response->status_code) + (rvg.empty() ? "" : ", VG " + rvg));
                      id(schalt_status).publish_state(ok ? "WEM hat bestaetigt, pruefe am Bus ..." :
                                                           "WEM-Antwort unklar (HTTP " + to_string(response->status_code) + "), pruefe am Bus ...");
                    }
                    id(befehl_melden)->execute();
                  }
          on_error:
            then:
              - lambda: |-
                  std::string zeit = id(wcan)->zeit("%H:%M ");
                  int ziel = id(wcan)->schalten.ziel;
                  if (ziel == 3) {
                    id(schreib_antwort).publish_state("WEM nicht erreichbar");
                    id(protokoll_eintrag)->execute("Schreibbefehl " + id(wcan)->schalten.vg + ": WEM nicht erreichbar");
                    id(wcan)->schalten.ziel = 0;
                  } else if (ziel == 1 || ziel == 2) {
                    auto &s = bf::schaltung();
                    s.uhr = id(wcan)->unix_zeit();
                    s.wem_antwort(bf::Wem::NICHT_ERREICHBAR, "WEM nicht erreichbar");
                    id(schalt_status).publish_state("WEM nicht erreichbar, pruefe trotzdem am Bus ...");
                    id(befehl_melden)->execute();
                  }
      # Der Bus entscheidet, nicht die WEM-Antwort: nach 3 s das Zielobjekt am Bus lesen.
      - delay: 3s
      - script.execute: bus_kontrolle
      - script.wait: bus_kontrolle

interval:
  - interval: 1s
    then:
      - script.execute: befehl_pruefen
canbus:
  - id: !extend my_can_bus
    on_frame:
      - can_id: 0x581
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40 || !reg::ist(reg::HK_BETRIEBSART, (x[2] << 8) | x[1], x[3])) return;
              uint8_t b = x[4];
              if (b >= 1 && b <= 8) id(hk_setzen).publish_state(wc::hk_name(b, "?"));
              if (id(wcan)->schalten.vorab && id(wcan)->schalten.ziel == 1) {   // Antwort auf die Vorab-Lesung
                id(wcan)->schalten.vorab_ist = b; id(wcan)->schalten.vorab = false; return;
              }
              if (id(wcan)->schalten.ziel != 1 || !id(wcan)->schalten.pruefen) return;
              auto &s = bf::schaltung();
              s.uhr = id(wcan)->unix_zeit();
              int soll = s.lauf.wert; std::string q = s.lauf.quelle;
              s.bus_wert(1, b);
              std::string zeit = id(wcan)->zeit("%H:%M:%S ");
              bool ok = b == soll;
              std::string ist = wc::hk_name(b, "?");
              id(schalt_status).publish_state(zeit + (ok ? "OK: Heizkreis steht auf " + ist : "NICHT uebernommen, Heizkreis steht auf " + ist));
              id(protokoll_eintrag)->execute("Heizkreis -> " + std::string(bf::hk_text(soll)) + " (" + q + "): " + (ok ? "ok" : "NICHT uebernommen, steht auf " + ist));
              id(wcan)->schalten.ziel = 0; id(wcan)->schalten.pruefen = false;
              id(befehl_melden)->execute();

select:
  - platform: template
    name: "Heizkreis Betriebsart setzen"
    id: hk_setzen
    options: ["Standby", "Zeitprogramm 1", "Zeitprogramm 2", "Zeitprogramm 3", "Sommer", "Komfort", "Normal", "Absenk"]
    optimistic: false
    web_server: { sorting_group_id: g_schalten, sorting_weight: 1 }
    set_action:
      - script.execute:
          id: befehl_eingang
          ziel: 1
          nutzlast: !lambda 'return x;'
          quelle: "Web/HA"
      - script.execute: befehl_pruefen

button:
  - platform: template
    name: "Schreiben"
    web_server: { sorting_group_id: g_schreiben, sorting_weight: 2 }
    on_press:
      - lambda: |-
          auto &sc = id(wcan)->schalten;
          sc.senden = false;
          if ((id(vorab_lesen).is_running() || id(wem_senden).is_running() || id(can_senden).is_running() || id(can_frei_senden).is_running() || id(sd_holen).is_running()) || sc.sperrminute(millis())) {
            id(schreib_antwort).publish_state("bitte warten - Abstand zum letzten Befehl"); return;
          }
          // Format: MI MX OX OS WERT (hex), z.B. "03 00 2520 02 02" = Warmwasser Aus.
          // Nur Systemgeraet (MI 01 SYSTEM0, 02 HZK0, 03 WW0) - nie der Kessel (wc::schreib_vg)
          std::string vg, fehler;
          if (!wc::schreib_vg(id(schreib_eingabe).state, vg, fehler)) { id(schreib_antwort).publish_state(fehler); return; }
          std::string og;
          if (!sc.schreib_buchen(millis(), (int) id(schreib_max).state, og)) { id(schreib_antwort).publish_state(og); return; }
          sc.vg = vg; sc.ziel = 3;
          sc.beginnen(millis(), (uint32_t) id(abstand_json).state * 1000); id(wcan)->anlass.eigener_befehl_ms = sc.letzter_befehl; sc.senden = true;
          uint32_t u = id(wcan)->unix_zeit();
          if (u != 0) bf::status().setze(bf::status().frei_ab, u + sc.sperre_s());
          id(schreib_antwort).publish_state("sende VG " + vg + " ...");
      - if:
          condition:
            lambda: 'return id(wcan)->schalten.senden;'
          then:
            - script.execute:
                id: wem_senden
                vg: !lambda 'return id(wcan)->schalten.vg;'
  - platform: template
    name: "CAN schreiben"
    web_server: { sorting_group_id: g_can_schreiben, sorting_weight: 4 }
    on_press:
      - script.execute:
          id: can_frei_senden
          eingabe: !lambda 'return id(can_eingabe).state;'
  - platform: template
    name: "SD-Datei holen"
    web_server: { sorting_group_id: g_sd, sorting_weight: 3 }
    on_press:
      - script.execute:
          id: sd_holen
          name: !lambda 'return id(sd_eingabe).state;'
  - platform: template
    name: "Warteschlange leeren"
    web_server: { sorting_group_id: g_schalten, sorting_weight: 5 }
    on_press:
      - lambda: |-
          auto &s = bf::schaltung();
          s.uhr = id(wcan)->unix_zeit();
          if (s.leeren() == 0) return;
          id(schalt_status).publish_state("Warteschlange geleert");
          id(protokoll_eintrag)->execute(std::string("Warteschlange von Hand geleert"));
      - script.execute: befehl_melden
text:
  - platform: template
    name: "Heizung: IP-Adresse"
    id: wem_ip
    optimistic: true
    restore_value: true
    initial_value: !secret wem_ip
    mode: text
    max_length: 40
    web_server: { sorting_group_id: g_einst, sorting_weight: 1 }
  - platform: template
    name: "WEM-Benutzer"
    id: wem_user
    optimistic: true
    internal: true           # Weishaupt ab Werk, laut Anleitung nicht aenderbar
    initial_value: !secret wem_user
    mode: text
    max_length: 32
  - platform: template
    name: "WEM-Passwort"
    id: wem_pass
    optimistic: true
    internal: true
    initial_value: !secret wem_pass
    mode: password
    max_length: 32
  - platform: template
    name: "SD-Datei (Name auf der SD-Karte des WEM)"
    id: sd_eingabe
    optimistic: true
    mode: text
    max_length: 40
    initial_value: "systable.csv"
    web_server: { sorting_group_id: g_sd, sorting_weight: 2 }
  # Knoten, an die das freie CAN-Schreiben senden darf (ab v42). Ab Werk nur 01 (WEM); weitere Knoten traegt man
  # ausdruecklich ein, z. B. "01 04". 02 (Kessel) und 00 werden abgelehnt - dann wird gar nicht gesendet.
  - platform: template
    name: "Freies CAN-Schreiben: erlaubte Knoten (hex, ab Werk 01)"
    id: can_frei_knoten
    optimistic: true
    restore_value: true
    mode: text
    max_length: 40
    initial_value: "01"
    web_server: { sorting_group_id: g_can_schreiben, sorting_weight: 2.5 }
    on_value:
      - lambda: |-
          wc::KnotenFreigabe frei; std::string f;
          if (wc::knoten_freigabe_lesen(x, frei, f)) ESP_LOGW("schreiben", "Freies CAN-Schreiben: erlaubte Knoten %s", frei.text().c_str());
          else ESP_LOGW("schreiben", "Freies CAN-Schreiben: erlaubte Knoten ungueltig (%s) - es wird nichts gesendet", f.c_str());
  - platform: template
    name: "CAN-Schreibbefehl (KN IDX SUB WERT [LAENGE] hex)"
    id: can_eingabe
    optimistic: true
    mode: text
    max_length: 255
    web_server: { sorting_group_id: g_can_schreiben, sorting_weight: 3 }
  - platform: template
    name: "Schreibbefehl (MI MX OX OS WERT hex)"
    id: schreib_eingabe
    optimistic: true
    mode: text
    max_length: 32
    web_server: { sorting_group_id: g_schreiben, sorting_weight: 1 }

text_sensor:
  - platform: template
    name: "Ergebnis letzter Schaltbefehl"
    id: schalt_status
    web_server: { sorting_group_id: g_schalten, sorting_weight: 4 }
  - platform: template
    name: "Warteschlange"
    id: warteschlange
    web_server: { sorting_group_id: g_schalten, sorting_weight: 3 }
  - platform: template
    name: "Schaltprotokoll"
    id: schalt_protokoll
    web_server: { sorting_group_id: g_schalten, sorting_weight: 6 }
  - platform: template
    name: "Schreibbefehl Antwort"
    id: schreib_antwort
    web_server: { sorting_group_id: g_schreiben, sorting_weight: 3 }
  - platform: template
    name: "CAN-Schreibbefehl Antwort"
    id: can_antwort
    web_server: { sorting_group_id: g_can_schreiben, sorting_weight: 5 }
  - platform: template
    name: "CAN-Schreibbefehl Rohdaten"
    id: can_roh
    web_server: { sorting_group_id: g_can_schreiben, sorting_weight: 6 }
  - platform: template
    name: "SD-Datei Antwort"
    id: sd_antwort
    web_server: { sorting_group_id: g_sd, sorting_weight: 4 }
  - platform: template
    name: "SD-Datei Inhalt (Anfang)"
    id: sd_inhalt
    web_server: { sorting_group_id: g_sd, sorting_weight: 5 }
  - platform: template
    name: "Systemtabelle (Knoten, Module)"
    id: systabelle
    web_server: { sorting_group_id: g_sd, sorting_weight: 6 }

number:
  # Abstand zwischen zwei Befehlen an den WEM (ab v38). Ueber die JSON-Schnittstelle mindestens 60 s
  # (sie verklemmt sonst); per CAN nimmt der WEM sofort an - der Abstand schont nur sein EEPROM.
  - platform: template
    id: abstand_can
    name: "Abstand zwischen Befehlen per CAN (s)"
    min_value: ${abstand_can_min}
    max_value: 300
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    web_server: { sorting_group_id: g_can_schreiben, sorting_weight: 3 }
  - platform: template
    id: abstand_json
    name: "Abstand zwischen Befehlen per JSON (s)"
    min_value: 60
    max_value: 600
    step: 1
    initial_value: 60
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    web_server: { sorting_group_id: g_schalten, sorting_weight: 9 }

  # Obergrenze der Schreibvorgaenge je Stunde (ab v42): Schutz gegen Schleifen (eine Automatik, die im Takt schaltet).
  # Gilt fuer alles, was das Board an den WEM schreibt: Schalten per CAN oder JSON, Schreibfeld, freies CAN-Schreiben,
  # Warmwasser-Push. Ist sie erreicht, wird nicht gesendet (Befehl "gescheitert", Grund obergrenze).
  - platform: template
    id: schreib_max
    name: "Schreibvorgaenge je Stunde hoechstens"
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 30
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    web_server: { sorting_group_id: g_schalten, sorting_weight: 10 }

# Schreibzaehler (ab v42): jeder Schreibbefehl des Boards an den WEM. "gesamt" bleibt ueber Neustarts erhalten.
sensor:
  - platform: template
    name: "Schreibvorgaenge letzte Stunde"
    id: schreib_stunde_s
    accuracy_decimals: 0
    update_interval: never
    web_server: { sorting_group_id: g_schalten, sorting_weight: 7 }
  - platform: template
    name: "Schreibvorgaenge gesamt"
    id: schreib_gesamt_s
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never
    web_server: { sorting_group_id: g_schalten, sorting_weight: 8 }

switch:
  - platform: template
    name: "Schalten per CAN statt JSON (Heizkreis, Warmwasser)"
    id: can_schalten
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON    # ab v42 Empfehlung: CAN ist der Hauptweg (Rueckweg: aus = JSON)
    web_server: { sorting_group_id: g_can_schreiben, sorting_weight: 1 }
  - platform: template
    name: "Freies CAN-Schreiben (Experten)"
    id: can_frei
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: { sorting_group_id: g_can_schreiben, sorting_weight: 2 }
  - platform: template
    name: "SD-Dateien abrufen"
    id: sd_erlaubt
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: { sorting_group_id: g_sd, sorting_weight: 1 }

