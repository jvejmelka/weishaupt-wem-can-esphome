# CAN-Bruecke ueber WLAN (Board an der Therme <-> Board mit Raumgeraet).
# Seit 08.11.2026: nach jedem Neustart schaltet sich die Bruecke
# einmal selbst ein, sobald das WLAN steht. Von Hand ausschalten bleibt bis zum naechsten Neustart aus.
# Nur fuer Versuche: siehe components/weishaupt_can/bruecke.h
# ${bruecke_ziel} = IP der Gegenstelle, ${bruecke_log} = IP fuer den Mitschnitt ("" = keiner), ${bruecke_name} = Kuerzel im Mitschnitt,
# ${bruecke_nur_bei_bus} = true: nur senden, wenn kurz zuvor etwas vom Bus kam (Board an der Therme)
globals:
  - id: bruecke_auto_erledigt
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: template
    name: "CAN-Bruecke (Experten)"
    id: bruecke_an
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          bruecke::schnell().start();
          bruecke::kanal("${bruecke_ziel}")->neu();
          ESP_LOGW("bruecke", "EIN (${bruecke_name})");
    on_turn_off:
      - lambda: |-
          bruecke::schnell().stop();
          ESP_LOGW("bruecke", "AUS");

canbus:
  - id: !extend my_can_bus
    rx_queue_len: 64
    tx_queue_len: 32
    on_frame:
      - can_id: 0x000
        can_id_mask: 0x000
        then:
          - lambda: |-
              bruecke::zaehler().letzter_empfang = millis();
              bruecke::zaehler().hat_empfang = true;
              if (!id(bruecke_an).state || !bruecke::gueltig(can_id)) return;
              bruecke::kanal("${bruecke_ziel}")->senden(can_id, remote_transmission_request, x);
              bruecke::zaehler().vom_bus++;
              bruecke::mitschnitt("${bruecke_log}", "${bruecke_name}")->frame('R', can_id, remote_transmission_request, x, millis());

interval:
  - interval: 5s  # Bruecke nach Neustart einmal selbst einschalten
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: 'return !id(bruecke_auto_erledigt);'
          then:
            - lambda: 'id(bruecke_auto_erledigt) = true;'
            - switch.turn_on: bruecke_an
  - interval: 1ms
    then:
      - lambda: |-
          if (!id(bruecke_an).state) return;
          auto *k = bruecke::kanal("${bruecke_ziel}");
          auto *m = bruecke::mitschnitt("${bruecke_log}", "${bruecke_name}");
          uint32_t cid; bool rtr; std::vector<uint8_t> d;
          while (k->holen(cid, rtr, d)) {
            if (!bruecke::gueltig(cid)) continue;
            // Therme aus/Bus still: nicht senden, sonst Fehlerzaehler bis Bus-off (05.11.2026)
            if (${bruecke_nur_bei_bus} && !bruecke::bus_aktiv(millis())) { bruecke::zaehler().gesperrt++; continue; }
            bool ok = id(my_can_bus)->send_data(cid, false, rtr, d) == canbus::ERROR_OK;
            if (ok) bruecke::zaehler().zum_bus++; else bruecke::zaehler().can_fehler++;
            m->frame(ok ? 'T' : 'X', cid, rtr, d, millis());
          }
          m->takt(millis());
  - interval: 10s
    then:
      - lambda: |-
          bruecke::bus_off_beheben(millis());
          if (!id(bruecke_an).state) return;
          bruecke::statistik(bruecke::mitschnitt("${bruecke_log}", "${bruecke_name}"), millis());
