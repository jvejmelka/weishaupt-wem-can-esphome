# Paket WARMWASSER-SCHALTEN: Warmwasser Ein/Aus ueber den WEM.
# Braucht die Pakete wem-schalten und warmwasser.
#   JSON MI03 / MX00 / OX 0x2520 / OS02: 1 = Ein, 2 = Aus (Bus: Knoten 1, 0x2A20/2)
#   MQTT: ${geraet}/cmd/warmwasser  "Ein" | "Aus" | "1" | "2" oder JSON {"id":18,"wert":"Aus"}
#   Rueckmeldung je Phase auf ${geraet}/befehl/status (wie beim Heizkreis, siehe TOPICS.md)

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          #ifdef USE_MQTT
          mqtt::global_mqtt_client->subscribe("${geraet}/cmd/warmwasser", [](const std::string &t, const std::string &p) {
            id(befehl_eingang)->execute(2, p, std::string("MQTT"));
          });
          #endif

canbus:
  - id: !extend my_can_bus
    on_frame:
      - can_id: 0x581
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40 || !reg::ist(reg::WW_BETRIEBSART, (x[2] << 8) | x[1], x[3])) return;
              uint8_t b = x[4];
              if (b == 1 || b == 2) id(ww_setzen).publish_state(b == 1 ? "Ein" : "Aus");
              if (id(wcan)->schalten.ziel != 2 || !id(wcan)->schalten.pruefen) return;
              auto &s = bf::schaltung();
              s.uhr = id(wcan)->unix_zeit();
              int soll = s.lauf.wert; std::string q = s.lauf.quelle;
              s.bus_wert(2, b);
              std::string zeit = id(wcan)->zeit("%H:%M:%S ");
              bool ok = b == soll;
              std::string ist = wc::ww_name(b, "?");
              id(schalt_status).publish_state(zeit + (ok ? "OK: Warmwasser " + ist : "NICHT uebernommen, Warmwasser " + ist));
              id(protokoll_eintrag)->execute(std::string("Warmwasser -> ") + bf::ww_text(soll) + " (" + q + "): " + (ok ? "ok" : "NICHT uebernommen, steht auf " + ist));
              id(wcan)->schalten.ziel = 0; id(wcan)->schalten.pruefen = false; id(wcan)->anlass.anlass_ms = millis() | 1;
              bf::status().anlass("schaltbefehl", true, true);
              id(befehl_melden)->execute();

select:
  - platform: template
    name: "Warmwasser setzen"
    id: ww_setzen
    options: ["Ein", "Aus"]
    optimistic: false
    web_server: { sorting_group_id: g_schalten, sorting_weight: 2 }
    set_action:
      - script.execute:
          id: befehl_eingang
          ziel: 2
          nutzlast: !lambda 'return x;'
          quelle: "Web/HA"
      - script.execute: befehl_pruefen
