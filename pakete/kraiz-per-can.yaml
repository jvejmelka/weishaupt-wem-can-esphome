          kc::anlegen(1, 0x2982, 2, false, 1.0f, 600, [](int32_t r, float v) { id(kc_sowi_umschaltung_hk1).publish_state(kc::text_SOWI_UMSCHALTUNG_MAP((int) r)); });
          kc::anlegen(1, 0x293B, 2, true, 0.1f, 600, [](int32_t r, float v) { id(kc_raumsolltemperatur_komfort).publish_state(v); });
          kc::anlegen(1, 0x293A, 2, true, 0.1f, 600, [](int32_t r, float v) { id(kc_raumsolltemperatur_normal).publish_state(v); });
          kc::anlegen(1, 0x2939, 2, true, 0.1f, 600, [](int32_t r, float v) { id(kc_raumsolltemperatur_absenk).publish_state(v); });
          kc::anlegen(1, 0x296B, 2, true, 0.1f, 600, [](int32_t r, float v) { id(kc_vorlaufsolltemperatur_komfort).publish_state(v); });
          kc::anlegen(1, 0x296A, 2, true, 0.1f, 600, [](int32_t r, float v) { id(kc_vorlaufsolltemperatur_normal).publish_state(v); });
          kc::anlegen(1, 0x2969, 2, true, 0.1f, 600, [](int32_t r, float v) { id(kc_vorlaufsolltemperatur_absenk).publish_state(v); });
          kc::anlegen(1, 0x292C, 2, true, 0.1f, 600, [](int32_t r, float v) { id(kc_vorlaufsolltemperatur_sonderniveau).publish_state(v); });
          kc::anlegen(1, 0x2959, 2, true, 0.1f, 60, [](int32_t r, float v) { id(kc_vorlaufsolltemperatur_aktuell).publish_state(v); });
          kc::anlegen(1, 0x2A69, 2, false, 1.0f, 60, [](int32_t r, float v) { id(kc_status_warmwasser).publish_state(kc::text_STATUS_WW_MAP((int) r)); });
          kc::anlegen(1, 0x2A49, 2, false, 1.0f, 60, [](int32_t r, float v) { id(kc_warmwasser_push).publish_state(kc::text_PUMPE_MAP((int) r)); });
          kc::anlegen(1, 0x2A38, 2, true, 0.1f, 600, [](int32_t r, float v) { id(kc_wwsolltemperatur_absenk).publish_state(v); });
          kc::anlegen(1, 0x2A51, 2, false, 1.0f, 60, [](int32_t r, float v) { id(kc_pumpe_warmwasser).publish_state(kc::text_PUMPE_MAP((int) r)); });
          kc::anlegen(1, 0x269D, 1, true, 0.1f, 60, [](int32_t r, float v) { id(kc_waermeanforderung_warmwasser).publish_state(v); });
          kc::anlegen(1, 0x2A57, 2, true, 0.1f, 60, [](int32_t r, float v) { id(kc_ruecklauftemperatur_zirkulation).publish_state(v); });
          kc::anlegen(1, 0x271F, 2, true, 0.1f, 60, [](int32_t r, float v) { id(kc_plattenwaermetauschertemperatur_b2).publish_state(v); });
          kc::anlegen(1, 0x2660, 2, true, 0.1f, 60, [](int32_t r, float v) { id(kc_pufferspeicher_temperatur_oben).publish_state(v); });
