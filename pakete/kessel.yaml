# Paket KESSEL (Pflicht): Kesselwerte vom CAN-Bus, Heizkreis-Zustand, Diagnose,
# Lesebefehl, Bus-Waechter, WLAN-Wechsel ueber die Weboberflaeche.
#
# Was dieses Paket auf den Bus schickt, sind ausschliesslich LESE-Anfragen
# (SDO-Upload, Kommandobyte 0x40). Es wird nie etwas auf den Kessel geschrieben.
#
# Takt nach Weishaupts eigener Vorgabe: das WEM-Portal bietet fuer seinen Datenlogger
# als kuerzestes Intervall 40 s je Wert an, die Datenpunktliste des WEM-Modbus-Gateways
# nennt Mindestabstaende von 30 s / 60 s / 10 min. Deshalb fragt die Firmware keinen
# Wert oefter als alle 40 s:
#   Kessel (Knoten 2): Temperatur, Abgas, Vorlauf, Leistung, Drehzahl, Brenner   alle 40 s
#   Kessel (Knoten 2): Vorlauf-Soll, Volumenstrom, Druck                         alle 60 s
#   WEM (Knoten 1):    Vorlauf Heizkreis, Vorlaufsoll-Anforderung                alle 60 s
#   WEM (Knoten 1):    Raumsoll                                                  alle 5 min
# Betriebsarten: nur nach Start, bei geaenderten Statusbits und nach Schaltbefehlen.
# Die Statusbits (0x274D) werden nicht abgefragt - der WEM sendet sie bei jeder
# Aenderung selbst (PDO 0x1C1).
#
# Mit dem Schalter "Eigene CAN-Anfragen" lassen sich die Abfragen ganz abschalten.
# Gesendet wird nur, wenn der Bus lebt (letzter Frame < 30 s), nach einem Board-Start erst nach
# 1 min, und nach einem Busausfall (Heizung war stromlos) erst nach ${anlaufpause_min} min,
# nachdem der Bus wieder da ist (Board-Start oder Heizung war stromlos): Nach einem
# Stromzyklus bekommt der WEM Ruhe, das Board hoert solange nur mit.

substitutions:
  anlaufpause_min: "10"
  # Startzustand des Schalters "Eigene CAN-Anfragen", wenn noch nichts gespeichert ist.
  # RESTORE_DEFAULT_OFF = nur mithoeren (Vorgabe), RESTORE_DEFAULT_ON = eigene Leseanfragen.
  can_anfragen_start: RESTORE_DEFAULT_OFF

# Das Bauteil weishaupt_can (components/weishaupt_can) haelt Zustand und Logik: Bus-Waechter,
# Anlass-Nachlesen, Lesebefehl, Scan, Brennerstarts, Regeln, Zusatzanzeigen, Schaltbefehle.
# Die Lambdas unten verdrahten nur noch Entitaeten und Bus damit (id(wcan)->...).
weishaupt_can:
  id: wcan
  canbus_id: my_can_bus
  time_id: uhr
  anlaufpause: ${anlaufpause_min}min

web_server:
  sorting_groups:
    - id: g_kessel
      name: "Kessel"
      sorting_weight: 10
    - id: g_betrieb
      name: "Betriebsarten und Sollwerte"
      sorting_weight: 20
    - id: g_energie
      name: "Energie"
      sorting_weight: 30
    - id: g_lesen
      name: "Lesebefehl (nur lesen)"
      sorting_weight: 40
    - id: g_codes
      name: "Zahlencodes (fuer Grafana/InfluxDB)"
      sorting_weight: 80
    - id: g_diag
      name: "Diagnose"
      sorting_weight: 90
    - id: g_einst
      name: "Einstellungen"
      sorting_weight: 95
    - id: g_fw
      name: "Firmware"
      sorting_weight: 100

interval:
  # Bus-Waechter: kommt N Minuten kein einziger Frame, Neustart (Bus-off-Falle).
  - interval: 60s
    then:
      - lambda: |-
          float m = id(waechter_min).state;
          if (isnan(m) || m <= 0) return;
          uint32_t grenze = (uint32_t) (m * 60000.0f);
          uint32_t jetzt = millis();
          if (jetzt > grenze && id(wcan)->bus.still(jetzt) > grenze) {
            ESP_LOGW("waechter", "%.0f min kein CAN-Frame - Neustart", m);
            App.safe_reboot();
          }
  # Kessel, alle 40 s
  - interval: 40s
    then:
      - if:
          condition:
            lambda: 'return id(can_anfragen).state && id(wcan)->bus.senden_erlaubt(millis());'
          then:
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x602, data: !lambda 'return reg::lese(reg::KESSEL_TEMP);' }  # Kesseltemperatur
            - delay: 150ms
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x602, data: !lambda 'return reg::lese(reg::ABGAS);' }  # Abgastemperatur
            - delay: 150ms
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x602, data: !lambda 'return reg::lese(reg::VORLAUF);' }  # Vorlauf
            - delay: 150ms
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x602, data: !lambda 'return reg::lese(reg::LEISTUNG);' }  # Leistung
            - delay: 150ms
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x602, data: !lambda 'return reg::lese(reg::DREHZAHL);' }  # Drehzahl
            - delay: 150ms
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x602, data: !lambda 'return reg::lese(reg::BRENNER);' }  # Brenner
  # Kessel und WEM, alle 60 s
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(can_anfragen).state && id(wcan)->bus.senden_erlaubt(millis());'
          then:
            - delay: 7s
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x602, data: !lambda 'return reg::lese(reg::VORLAUF_SOLL);' }  # Vorlauf Soll
            - delay: 150ms
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x602, data: !lambda 'return reg::lese(reg::VOLUMENSTROM);' }  # Volumenstrom
            - delay: 150ms
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x602, data: !lambda 'return reg::lese(reg::DRUCK);' }  # Anlagendruck
            - delay: 150ms
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x601, data: !lambda 'return reg::lese(reg::HK_VORLAUF);' }  # Vorlauf Heizkreis
            - delay: 150ms
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x601, data: !lambda 'return reg::lese(reg::VL_SOLL_ANF);' }  # Vorlaufsoll-Anforderung
  # WEM, alle 5 min: Raumsoll (wechselt mit dem Zeitprogramm)
  - interval: 300s
    then:
      - if:
          condition:
            lambda: 'return id(can_anfragen).state && id(wcan)->bus.senden_erlaubt(millis());'
          then:
            - delay: 13s
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x601, data: !lambda 'return reg::lese(reg::RAUMSOLL);' }  # Raumsoll aktuell

  # Betriebsarten (liegen im WEM) werden NICHT periodisch gelesen, sondern nur bei Anlass,
  # unabhaengig vom Schalter "Eigene CAN-Anfragen":
  #   - einmal, wenn die Anlaufpause vorbei ist (Board-Start, Bus wieder da)
  #   - wenn sich die Statusbits aendern (PDO 0x1C1, z.B. Umstellung am Display/Portal)
  #   - nach einem eigenen Schaltbefehl (das Schalten-Paket liest dann gezielt nach)
  #   - auf Wunsch: Knopf "Status lesen" bzw. MQTT ${geraet}/cmd/status (Skript status_lesen,
  #     hebt die 2-min-Grenze fuer diese eine Lesung auf, nimmt Wuensche hoechstens alle 10 s an)
  # Anlass = Zeitpunkt; gelesen wird 5 s danach, hoechstens alle 2 min (wc::Anlass in kern.h).
  # Das Warmwasser-Paket haengt sich mit eigener Merkvariable an denselben Anlass.
  - interval: 5s
    then:
      - lambda: |-
          uint32_t jetzt = millis();
          id(wcan)->anlass.hk_takt(id(wcan)->bus.senden_erlaubt(jetzt), jetzt);
      - if:
          condition:
            lambda: 'return id(wcan)->anlass.hk_jetzt;'
          then:
            - canbus.send: { canbus_id: my_can_bus, can_id: 0x601, data: !lambda 'return reg::lese(reg::HK_BETRIEBSART);' }  # Heizkreis-Betriebsart

script:
  # Status auf Wunsch: Heizkreis-Betriebsart (0x2933/2) und - mit Paket warmwasser -
  # Warmwasser-Betriebsart und -Sollwerte einmal vom Bus lesen. Nutzt das Anlass-Nachlesen
  # (interval 5s), schickt also nur LESE-Anfragen an Knoten 1, nie etwas an den WEM per JSON.
  - id: status_lesen
    mode: single
    then:
      - lambda: |-
          std::string z = id(wcan)->zeit("%H:%M:%S ");
          // 2-min-Grenze fuer diese Lesung aufheben, naechster 5-s-Takt liest sofort
          switch (id(wcan)->anlass.anfordern(id(wcan)->bus, millis())) {
            case wc::Anlass::Status::SCHWEIGT: id(status_gelesen).publish_state(z + "Bus schweigt - nicht gelesen"); break;
            case wc::Anlass::Status::VERWORFEN: ESP_LOGI("status", "Status-Anforderung verworfen (hoechstens alle 10 s)"); break;
            case wc::Anlass::Status::PAUSE: id(status_gelesen).publish_state(z + "angefordert - Anlaufpause, liest danach"); break;
            case wc::Anlass::Status::ANGEFORDERT: id(status_gelesen).publish_state(z + "angefordert ..."); break;
          }

canbus:
  - platform: esp32_can
    id: my_can_bus
    can_id: 0x602
    tx_pin: GPIO27
    rx_pin: GPIO26
    bit_rate: 50kbps
    on_frame:
      # jeder Frame: Lebenszeichen des Busses + Antwort auf einen offenen Lesebefehl
      - can_id: 0x000
        can_id_mask: 0x000
        then:
          - lambda: |-
              id(wcan)->frame(millis());
              std::string t;
              if (id(wcan)->lesen.antwort(can_id, x, t)) id(lese_antwort).publish_state(t);

      # PDO 0x201: Aussentemperatur + Systembetriebsart (Kessel sendet von selbst)
      - can_id: 0x201
        then:
          - lambda: |-
              id(wem_aussentemp).publish_state(reg::pdo_wert(reg::AUSSENTEMP, x));
              int sb = x[reg::SYSTEMBETRIEBSART.byte];
              id(wem_systembetriebsart_code).publish_state((float) sb);
              id(wem_systembetriebsart).publish_state(wc::system_text(sb));

      # PDO 0x241: Heizanforderung (Bytes 0-1); Bytes 6-7 = Warmwasser (Paket warmwasser)
      - can_id: 0x241
        then:
          - lambda: |-
              id(wem_heizanforderung).publish_state(reg::pdo_wert(reg::VORLAUFSOLL_HZ, x));
              // Bytes 2-3: Kesseltemperatur (gleich 0x2532) - kommt so alle paar Sekunden, ohne Anfrage
              if (x.size() >= 4) id(wem_kessel).publish_state(reg::pdo_wert(reg::KESSEL_TEMP_PDO, x));

      # PDO 0x181: Datum und Uhrzeit der Heizung (Stunde, Minute, Jahr-2000, Monat, Tag, Wochentag)
      - can_id: 0x181
        then:
          - lambda: |-
              if (x.size() < 6) return;
              id(heizung_uhr).publish_state(wc::uhr_text(x));

      # SDO-Download an Knoten 0x42 (0x6C2): der Kessel meldet alle ~5 s Werte weiter.
      # Rein passiv mitgelesen. Objekte laut geronet1/wem-python, Werte an der Anlage plausibel.
      - can_id: 0x6C2
        then:
          - lambda: |-
              if (x.size() < 6 || (x[0] != 0x2B && x[0] != 0x2F && x[0] != 0x23)) return;
              uint16_t idx = (x[2] << 8) | x[1];
              uint8_t sub = x[3];
              int16_t v = (int16_t)((x[5] << 8) | x[4]);
              if (sub != 1) return;
              if (reg::ist(reg::RUECKLAUF_VPT, idx, sub)) id(wem_ruecklauf).publish_state(reg::wert(reg::RUECKLAUF_VPT, v));
              else if (reg::ist(reg::VORLAUF_VPT, idx, sub)) id(wem_vorlauf_vpt).publish_state(reg::wert(reg::VORLAUF_VPT, v));
              else if (reg::ist(reg::SOLLLEISTUNG, idx, sub)) id(wem_sollleistung).publish_state(reg::wert(reg::SOLLLEISTUNG, v));

      # PDO 0x182: Kesselstatus (Objekt 0x2530)
      - can_id: 0x182
        then:
          - lambda: |-
              uint8_t st = x[reg::KESSELSTATUS.byte];
              id(wem_kesselstatus).publish_state(bf::kessel_text(st));
              bf::status().setze(bf::status().kesselstatus, (int) st);
              id(wem_kesselstatus_code).publish_state((float) st);

      # PDO 0x1C1: Statusbits Knoten 1 (Objekt 0x274D) - 0x1000 Heizkreis Standby, 0x0010 WW-Ladung
      - can_id: 0x1C1
        then:
          - lambda: |-
              uint16_t m = (x[reg::STATUSBITS_PDO.byte + 1] << 8) | x[reg::STATUSBITS_PDO.byte];
              id(wcan)->anlass.statusbits(m, millis());
              id(wem_betriebsart_hk).publish_state(wc::hk_status_text(m));
              id(wem_betriebsart_hk_code).publish_state((float) m);

      # SDO-Antworten Knoten 1 (Systemgeraet)
      - can_id: 0x581
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40) return;
              uint16_t idx = (x[2] << 8) | x[1];
              uint8_t sub = x[3];
              if (reg::ist(reg::STATUSBITS, idx, sub)) {
                uint16_t m = (x[5] << 8) | x[4];
                id(wem_betriebsart_hk_code).publish_state((float) m);
                id(wem_betriebsart_hk).publish_state(wc::hk_status_text(m));
                bf::status().setze(bf::status().hk_bits, (int) m);
              } else if (reg::ist(reg::VL_SOLL_ANF, idx, sub)) {
                id(wem_ww_vlsoll).publish_state(reg::wert(reg::VL_SOLL_ANF, (int16_t)((x[5] << 8) | x[4])));
              } else if (reg::ist(reg::HK_BETRIEBSART, idx, sub)) {
                // Heizkreis-Betriebsart (JSON MI02 0x2533/02)
                uint8_t b = x[4];
                id(hk_betriebsart_code).publish_state((float) b);
                id(hk_betriebsart).publish_state(wc::hk_name(b, "unbekannt"));
                bf::status().hk_gelesen(b, id(wcan)->unix_zeit());
                id(status_gelesen).publish_state(id(wcan)->zeit("%d.%m. %H:%M:%S ") + "gelesen");
              } else if (reg::ist(reg::RAUMSOLL, idx, sub) || reg::ist(reg::HK_VORLAUF, idx, sub)) {
                int16_t v = (int16_t)((x[5] << 8) | x[4]);
                if (v == (int16_t) 0x8000) return;
                if (reg::ist(reg::RAUMSOLL, idx, sub)) id(hk_raumsoll_akt).publish_state(reg::wert(reg::RAUMSOLL, v));
                else id(hk_vorlauf).publish_state(reg::wert(reg::HK_VORLAUF, v));
              }

      # SDO-Antworten Knoten 2 (Kessel)
      - can_id: 0x582
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40) return;
              uint16_t idx = (x[2] << 8) | x[1];
              uint8_t sub = x[3];
              int32_t v = (int32_t)((uint32_t)x[7] << 24 | (uint32_t)x[6] << 16 | (uint32_t)x[5] << 8 | (uint32_t)x[4]);
              if (reg::ist(reg::DRUCK, idx, sub)) id(wem_druck).publish_state(reg::wert(reg::DRUCK, v));
              else if (reg::ist(reg::LEISTUNG, idx, sub)) id(wem_leistung).publish_state(reg::wert(reg::LEISTUNG, v));
              else if (reg::ist(reg::DREHZAHL, idx, sub)) id(wem_drehzahl).publish_state(reg::wert(reg::DREHZAHL, v));
              else if (reg::ist(reg::VORLAUF, idx, sub)) id(wem_vorlauf).publish_state(reg::wert(reg::VORLAUF, v));
              else if (reg::ist(reg::ABGAS, idx, sub)) id(wem_abgas).publish_state(reg::wert(reg::ABGAS, v));
              else if (reg::ist(reg::KESSEL_TEMP, idx, sub)) id(wem_kessel).publish_state(reg::wert(reg::KESSEL_TEMP, v));
              else if (reg::ist(reg::VORLAUF_SOLL, idx, sub)) id(wem_vorlauf_soll).publish_state(reg::wert(reg::VORLAUF_SOLL, v));
              else if (reg::ist(reg::BRENNER, idx, sub)) {
                // Betriebsphase Brenner: "Ein" nur mit Flamme (2/3); Flanke 0 -> 1 zaehlt einen Start
                int ph = v & 0xFF, b = 0;
                bool start = id(wcan)->brenner.phase(ph, b);
                id(wem_brennerphase).publish_state((float) ph);
                id(wem_brenner).publish_state((float) b);
                id(wem_brenner_text).publish_state(wc::brenner_text(ph));
                if (start) id(wem_brennerstarts).publish_state((float) id(wcan)->brenner.starts);
              }
              else if (reg::ist(reg::VOLUMENSTROM, idx, sub)) id(wem_volumenstrom).publish_state(reg::wert(reg::VOLUMENSTROM, v));
              else if (reg::ist(reg::WM_HEIZUNG, idx, sub)) id(wem_wm_heizung).publish_state(reg::wert(reg::WM_HEIZUNG, v));
              else if (reg::ist(reg::WM_WW, idx, sub)) id(wem_wm_ww).publish_state(reg::wert(reg::WM_WW, v));
              else if (reg::ist(reg::WM_GESAMT, idx, sub)) id(wem_wm_gesamt).publish_state(reg::wert(reg::WM_GESAMT, v));

text_sensor:
  - platform: template
    name: "Kesselstatus"
    id: wem_kesselstatus
    web_server: { sorting_group_id: g_kessel, sorting_weight: 1 }
  - platform: template
    name: "Uhrzeit Heizung"          # aus PDO 0x181 - geht die Heizungsuhr falsch, laufen Zeitprogramme falsch
    id: heizung_uhr
    web_server: { sorting_group_id: g_diag, sorting_weight: 13 }
  - platform: template
    name: "Brenner Status"
    id: wem_brenner_text
    web_server: { sorting_group_id: g_kessel, sorting_weight: 2 }
  - platform: template
    name: "Systembetriebsart"
    id: wem_systembetriebsart
    web_server: { sorting_group_id: g_betrieb, sorting_weight: 1 }
  - platform: template
    name: "Heizkreis Betriebsart"
    id: hk_betriebsart
    web_server: { sorting_group_id: g_betrieb, sorting_weight: 2 }
  - platform: template
    name: "Heizkreis Status"
    id: wem_betriebsart_hk
    web_server: { sorting_group_id: g_betrieb, sorting_weight: 3 }
  - platform: template
    name: "Status gelesen"             # Zeitpunkt der letzten Lesung der Betriebsarten
    id: status_gelesen
    web_server: { sorting_group_id: g_betrieb, sorting_weight: 12 }
  - platform: template
    name: "Lesebefehl Antwort"
    id: lese_antwort
    web_server: { sorting_group_id: g_lesen, sorting_weight: 3 }
  - platform: template
    name: "Eigene CAN-Anfragen"
    update_interval: 30s
    web_server: { sorting_group_id: g_diag, sorting_weight: 4 }
    lambda: 'return {wc::anfragen_text(id(can_anfragen).state, id(wcan)->bus, millis())};'
  - platform: template
    name: "WLAN-Wechsel"
    id: wlan_ergebnis
    web_server: { sorting_group_id: g_einst, sorting_weight: 23 }
  - platform: template
    name: "Firmware"
    id: fw_stand
    lambda: 'return {"${firmware}"};'
    update_interval: 3600s
    web_server: { sorting_group_id: g_fw, sorting_weight: 1 }
  - platform: version
    name: "ESPHome-Version"
    hide_timestamp: false
    web_server: { sorting_group_id: g_fw, sorting_weight: 2 }
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      web_server: { sorting_group_id: g_diag, sorting_weight: 5 }
    ssid:
      name: "WLAN"
      web_server: { sorting_group_id: g_diag, sorting_weight: 6 }
    dns_address:
      name: "DNS-Server"
      web_server: { sorting_group_id: g_diag, sorting_weight: 9 }
    bssid:
      name: "WLAN-Zugangspunkt (BSSID)"
      web_server: { sorting_group_id: g_diag, sorting_weight: 11 }
    mac_address:
      name: "MAC-Adresse"
      web_server: { sorting_group_id: g_diag, sorting_weight: 12 }
  - platform: template
    name: "Gateway"
    update_interval: 60s
    web_server: { sorting_group_id: g_diag, sorting_weight: 7 }
    lambda: |-
      esp_netif_t *n = esp_netif_get_handle_from_ifkey("WIFI_STA_DEF");
      esp_netif_ip_info_t ip;
      if (n == nullptr || esp_netif_get_ip_info(n, &ip) != ESP_OK) return {"-"};
      char b[20]; snprintf(b, sizeof(b), IPSTR, IP2STR(&ip.gw));
      return {b};
  - platform: template
    name: "Netzmaske"
    update_interval: 60s
    web_server: { sorting_group_id: g_diag, sorting_weight: 8 }
    lambda: |-
      esp_netif_t *n = esp_netif_get_handle_from_ifkey("WIFI_STA_DEF");
      esp_netif_ip_info_t ip;
      if (n == nullptr || esp_netif_get_ip_info(n, &ip) != ESP_OK) return {"-"};
      char b[20]; snprintf(b, sizeof(b), IPSTR, IP2STR(&ip.netmask));
      return {b};

button:
  - platform: template
    name: "Status lesen"               # Betriebsarten einmal vom Bus lesen (nur Leseanfragen)
    web_server: { sorting_group_id: g_betrieb, sorting_weight: 11 }
    on_press:
      - script.execute: status_lesen
  - platform: restart
    name: "Neustart ESP"
    web_server: { sorting_group_id: g_diag, sorting_weight: 10 }
  - platform: template
    name: "Lesen"
    web_server: { sorting_group_id: g_lesen, sorting_weight: 2 }
    on_press:
      - lambda: |-
          std::string m; uint32_t cid = 0; std::vector<uint8_t> d;
          bool senden = id(wcan)->lesen.starten(id(lese_eingabe).state, id(wcan)->bus.tot(millis()), m, cid, d);
          id(lese_antwort).publish_state(m);
          if (senden) id(wcan)->senden(cid, d);
  # WLAN wechseln: neue Daten eintragen, dann diesen Knopf. Klappt die Verbindung
  # binnen 30 s, werden die Daten gespeichert; sonst bleibt das bisherige WLAN.
  # Letzter Rueckweg ist der Notfall-Hotspot (ap) mit Captive Portal.
  - platform: template
    name: "WLAN uebernehmen"
    web_server: { sorting_group_id: g_einst, sorting_weight: 22 }
    on_press:
      - if:
          condition:
            lambda: 'return id(wlan_neu_ssid).state.empty();'
          then:
            - lambda: 'id(wlan_ergebnis).publish_state("bitte zuerst den WLAN-Namen eintragen");'
          else:
            - lambda: 'id(wlan_ergebnis).publish_state("verbinde mit " + id(wlan_neu_ssid).state + " ...");'
            - wifi.configure:
                ssid: !lambda 'return id(wlan_neu_ssid).state;'
                password: !lambda 'return id(wlan_neu_pass).state;'
                save: true
                timeout: 30s
                on_connect:
                  - lambda: 'id(wlan_ergebnis).publish_state("verbunden und gespeichert: " + id(wlan_neu_ssid).state);'
                on_error:
                  - lambda: 'id(wlan_ergebnis).publish_state("keine Verbindung zu " + id(wlan_neu_ssid).state + " - bisheriges WLAN bleibt");'

switch:
  # Eigene CAN-Anfragen: AUS = das Board hoert nur mit und wertet aus, was ohnehin auf dem
  # Bus liegt (Kessel-PDOs, Antworten auf Fragen des WEM). Schalten ueber den WEM bleibt
  # erlaubt, samt der einen Kontroll-Leseanfrage danach; ebenso der Lesebefehl von Hand.
  - platform: template
    name: "Eigene CAN-Anfragen"
    id: can_anfragen
    optimistic: true
    restore_mode: ${can_anfragen_start}
    web_server: { sorting_group_id: g_einst, sorting_weight: 5 }
    # Beim Abschalten: alles, was nur durch eigene Abfragen aktuell blieb, auf "unbekannt".
    # Fragt der WEM einen Wert selbst ab, fuellt das Mithoeren ihn sofort wieder.
    on_turn_off:
      - lambda: |-
          for (auto *s : {id(wem_kessel), id(wem_abgas), id(wem_vorlauf), id(wem_leistung), id(wem_drehzahl),
                          id(wem_brenner), id(wem_brennerphase), id(wem_vorlauf_soll), id(wem_volumenstrom), id(wem_druck),
                          id(hk_vorlauf), id(wem_ww_vlsoll), id(hk_raumsoll_akt)})
            s->publish_state(NAN);
          id(wem_brenner_text).publish_state("unbekannt");
          id(wcan)->brenner.vorher = -1;

number:
  - platform: template
    name: "Waechter: Neustart nach Minuten ohne Bus (0 = aus)"
    id: waechter_min
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 0
    max_value: 120
    step: 1
    mode: box
    web_server: { sorting_group_id: g_einst, sorting_weight: 10 }

text:
  # Lesebefehl "KNOTEN INDEX SUB" hex, z.B. "01 2933 02". NUR LESEN (Kommandobyte 0x40).
  - platform: template
    name: "Lesebefehl (KN IDX SUB hex)"
    id: lese_eingabe
    optimistic: true
    mode: text
    max_length: 24
    web_server: { sorting_group_id: g_lesen, sorting_weight: 1 }
  - platform: template
    name: "WLAN-Name (neu)"
    id: wlan_neu_ssid
    optimistic: true
    mode: text
    max_length: 32
    web_server: { sorting_group_id: g_einst, sorting_weight: 20 }
  - platform: template
    name: "WLAN-Passwort (neu)"
    id: wlan_neu_pass
    optimistic: true
    mode: password
    max_length: 64
    web_server: { sorting_group_id: g_einst, sorting_weight: 21 }

sensor:
  # --- Kessel ---
  - platform: template
    name: "Kesseltemperatur"
    id: wem_kessel
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 4 }
  - platform: template
    name: "Vorlauf"                  # 0x2536/00 - existiert, Deutung bei laufendem Brenner noch zu pruefen
    id: wem_vorlauf
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 5 }
  - platform: template
    name: "Ruecklauf"                # 0x2699 VPT, passiv aus 0x6C2 (am 27.09. 17,9 bei 18,5 Vorlauf)
    id: wem_ruecklauf
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 5 }
  - platform: template
    name: "Vorlauf VPT"              # 0x2697 VPT, passiv aus 0x6C2
    id: wem_vorlauf_vpt
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 5 }
  - platform: template
    name: "Sollleistung"             # 0x2698, passiv aus 0x6C2
    id: wem_sollleistung
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 8 }
  - platform: template
    name: "Vorlauf Soll"
    id: wem_vorlauf_soll
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 6 }
  - platform: template
    name: "Abgastemperatur"          # Objekt 0x2537 (in manchen Vorlagen faelschlich "Ruecklauf")
    id: wem_abgas
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 7 }
  - platform: template
    name: "Leistung"
    id: wem_leistung
    unit_of_measurement: "%"
    device_class: power_factor
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 8 }
  - platform: template
    name: "Drehzahl"
    id: wem_drehzahl
    unit_of_measurement: "U/min"
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 9 }
  - platform: template
    name: "Anlagendruck"
    id: wem_druck
    unit_of_measurement: "bar"
    device_class: pressure
    accuracy_decimals: 2
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 10 }
  - platform: template
    name: "Volumenstrom"
    id: wem_volumenstrom
    unit_of_measurement: "l/h"
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 11 }
  - platform: template
    name: "Heizanforderung"
    id: wem_heizanforderung
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 12 }
  - platform: template
    name: "Aussentemperatur"
    id: wem_aussentemp
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 13 }
  - platform: template
    name: "Brennerstarts"
    id: wem_brennerstarts
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 3 }
  # --- Heizkreis ---
  - platform: template
    name: "Raumsoll aktuell"
    id: hk_raumsoll_akt
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_betrieb, sorting_weight: 4 }
  - platform: template
    name: "Vorlauf Heizkreis"
    id: hk_vorlauf
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_betrieb, sorting_weight: 5 }
  - platform: template
    name: "Vorlaufsoll Anforderung"
    id: wem_ww_vlsoll
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_betrieb, sorting_weight: 11 }
  # --- Energie (Vortageswerte, der Kessel liefert sie nur, wenn der WEM sie abfragt) ---
  - platform: template
    name: "Wärmemenge Vortag Heizung"
    id: wem_wm_heizung
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    update_interval: never
    web_server: { sorting_group_id: g_energie, sorting_weight: 1 }
  - platform: template
    name: "Wärmemenge Vortag WW"
    id: wem_wm_ww
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    update_interval: never
    web_server: { sorting_group_id: g_energie, sorting_weight: 2 }
  - platform: template
    name: "Wärmemenge Vortag Gesamt"
    id: wem_wm_gesamt
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    update_interval: never
    web_server: { sorting_group_id: g_energie, sorting_weight: 3 }
  # --- Zahlencodes (Text steht jeweils daneben; Zahlen fuer Grafana/InfluxDB) ---
  - platform: template
    name: "Brennerphase"             # 0 aus, 1 Vorbelueftung, 2 Steuer-, 3 Regelbetrieb, 4 Nachbelueftung
    id: wem_brennerphase
    update_interval: never
    web_server: { sorting_group_id: g_codes, sorting_weight: 1 }
  - platform: template
    name: "Brenner"                  # 1 = Flamme an (Phase 2/3), sonst 0; aus den Flanken rechnet Grafana die Taktung
    id: wem_brenner
    update_interval: never
    web_server: { sorting_group_id: g_codes, sorting_weight: 1 }
  - platform: template
    name: "Kesselstatus Code"
    id: wem_kesselstatus_code
    update_interval: never
    web_server: { sorting_group_id: g_codes, sorting_weight: 2 }
  - platform: template
    name: "Heizkreis Status Code"
    id: wem_betriebsart_hk_code
    update_interval: never
    web_server: { sorting_group_id: g_codes, sorting_weight: 3 }
  - platform: template
    name: "Heizkreis Betriebsart Code"
    id: hk_betriebsart_code
    update_interval: never
    web_server: { sorting_group_id: g_codes, sorting_weight: 4 }
  - platform: template
    name: "Systembetriebsart Code"
    id: wem_systembetriebsart_code
    update_interval: never
    web_server: { sorting_group_id: g_codes, sorting_weight: 6 }
  # --- Diagnose ---
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
    web_server: { sorting_group_id: g_diag, sorting_weight: 1 }
  - platform: uptime
    name: "Laufzeit"
    update_interval: 60s
    web_server: { sorting_group_id: g_diag, sorting_weight: 3 }
  - platform: template
    name: "Letzter CAN-Frame vor"    # Grafana-Warnung, wenn dauerhaft > 300 s
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return id(wcan)->bus.still(millis()) / 1000.0f;'
    web_server: { sorting_group_id: g_diag, sorting_weight: 4 }
