    web_server: { sorting_group_id: g_kessel, sorting_weight: 12 }
  - platform: template
    name: "Aussentemperatur"
    id: wem_aussentemp
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 13 }
  - platform: template
    name: "Brennerstarts"
    id: wem_brennerstarts
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 3 }
  # --- Heizkreis ---
  - platform: template
    name: "Raumsoll aktuell"
    id: hk_raumsoll_akt
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_betrieb, sorting_weight: 4 }
  - platform: template
