    name: "Kesseltemperatur"
    id: wem_kessel
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 4 }
  - platform: template
    name: "Vorlauf"
    id: wem_vorlauf
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 5 }
  - platform: template
    name: "Vorlauf Soll"
    id: wem_vorlauf_soll
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 6 }
  - platform: template
    name: "Abgastemperatur"          # Objekt 0x2537 (in manchen Vorlagen faelschlich "Ruecklauf")
    id: wem_abgas
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    web_server: { sorting_group_id: g_kessel, sorting_weight: 7 }
  - platform: template
    name: "Leistung"
    id: wem_leistung
    unit_of_measurement: "%"
