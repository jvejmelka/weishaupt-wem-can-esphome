    web_server: { sorting_group_id: g_eigene, sorting_weight: 3 }
    on_press:
      - script.execute:
          id: vd_befehl
          befehl: !lambda 'return id(vd_befehl_eingabe).state;'

text_sensor:
  - platform: template
    name: "Regeln aktiv"
    id: vd_aktiv_ts
    update_interval: 30s
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 3 }
    lambda: |-
      std::string s;
      switch_::Switch *sw[] = {id(vd_r1), id(vd_r2), id(vd_r3), id(vd_r4), id(vd_r5)};
      number::Number *ab[] = {id(vd_ab_r1), id(vd_ab_r2), id(vd_ab_r3), id(vd_ab_r4), id(vd_ab_r5)};
      for (int i = 0; i < 5; i++) {
        if (!sw[i]->state) continue;
        if (!s.empty()) s += ", ";
        s += "R" + to_string(i + 1) + " " + to_string((int) ab[i]->state) + " min";
      }
      if (s.empty()) s = "R1-R5 aus (gelesen wird nur bei Start, Schaltbefehl und 'Status lesen')";
      int n = 0; for (auto &r : vd::eigene()) if (r.an) n++;
      if (!id(vd_eigene_haupt).state) s += " | eigene Regeln aus";
      else s += " | eigene Regeln an: " + to_string(n) + " aktiv";
      uint32_t jetzt = millis(); int h = 0;
      for (auto t : id(vd_zeiten)) if (jetzt - t <= 3600000UL) h++;
      s += " | max " + to_string((int) id(vd_max_h).state) + "/h, letzte Stunde " + to_string(h);
      if (id(bus_seit) == 0 || jetzt - id(letzter_frame) > 30000) s += " | Bus schweigt";
      else if (jetzt - id(bus_seit) <= id(pause_ms)) s += " | Anlaufpause";
      return {s};
  - platform: template
    name: "Regeln Protokoll"
    id: vd_protokoll_ts
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 4 }
  - platform: template
    name: "Regeln-Datei (MQTT cmd-regeln)"
    id: vd_datei_ts
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 5 }
  - platform: template
    name: "R1 was und warum"
    update_interval: 86400s
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 12 }
    lambda: 'return {"Bei jedem Warmwasser-Wechsel fragt der WEM den Kessel 2101/0A, 2102/0D, 2102/01 ab (Kommandobyte A4). Kommt diese Folge ohne eigenen Schaltbefehl (letzte 2 min), wurde am Display, im Portal oder in der Weishaupt-App umgeschaltet -> Warmwasser-Betriebsart lesen. Die Richtung zeigt die Folge nicht."};'
  - platform: template
    name: "R1 zuletzt ausgeloest"
    id: vd_r1_zul
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 13 }
  - platform: template
    name: "R2 was und warum"
    update_interval: 86400s
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 22 }
    lambda: 'return {"Der Kessel geht in den Warmwasserbetrieb (Status 15 bzw. WEM schreibt 0x252B = 0F), bekannt ist aber Warmwasser Aus. Dann wurde Warmwasser vermutlich eingeschaltet -> Warmwasser-Betriebsart lesen."};'
  - platform: template
    name: "R2 zuletzt ausgeloest"
    id: vd_r2_zul
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 23 }
  - platform: template
    name: "R3 was und warum"
    update_interval: 86400s
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 32 }
    lambda: 'return {"Der WEM sendet seine Statusbits (PDO 0x1C1) nur bei Aenderung. Aendert sich das Standby-Bit 0x1000 (Heizung ein <-> Standby), -> Heizkreis-Betriebsart lesen. Wechsel zwischen Zeitprogrammen, Komfort/Normal/Absenk sieht R3 nicht."};'
  - platform: template
    name: "R3 zuletzt ausgeloest"
    id: vd_r3_zul
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 33 }
  - platform: template
    name: "R4 was und warum"
    update_interval: 86400s
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 42 }
    lambda: 'return {"Heizanforderung (0x252B = 0A bzw. Kessel im Heizbetrieb) obwohl Standby/Sommer bekannt ist, oder die aus Vorlaufsoll und Aussentemperatur zurueckgerechnete Raumsoll-Stufe (18/20/21) passt nicht zu Komfort/Normal/Absenk -> Heizkreis-Betriebsart lesen. Rueckrechnung nur bei milder Aussentemperatur geeicht, deshalb Vorgabe aus."};'
  - platform: template
    name: "R4 zuletzt ausgeloest"
    id: vd_r4_zul
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 43 }
  - platform: template
    name: "R5 was und warum"
    update_interval: 86400s
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 52 }
    lambda: 'return {"Aendern sich die uebrigen Statusbits des WEM (PDO 0x1C1, ohne Standby, WW-Ladung, Heizbetrieb) - meist wenn Heizbedarf entsteht oder endet -, -> Heizkreis-Betriebsart lesen. Loest oft aus, bestaetigt meist nur den bekannten Stand; deshalb Vorgabe aus."};'
  - platform: template
    name: "R5 zuletzt ausgeloest"
    id: vd_r5_zul
    web_server: { sorting_group_id: g_verdacht, sorting_weight: 53 }
  - platform: template
    name: "Eigene Regeln"
    id: vd_eigene_ts
    web_server: { sorting_group_id: g_eigene, sorting_weight: 1 }
  - platform: template
    name: "Regel-Befehl Antwort"
    id: vd_befehl_ts
    web_server: { sorting_group_id: g_eigene, sorting_weight: 4 }
