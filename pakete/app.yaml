# Paket APP (ab v38): die Heizungs-App laeuft direkt auf dem Board - kein Server, kein Docker.
#
#   http://<board>/ und /app  die App (dieselbe Oberflaeche wie app/ im Repository)
#   http://<board>/experten   die ESPHome-Weboberflaeche (ab v42; Benutzer admin, Admin-Passwort)
#
# Login der App: app_benutzer und app_passwort aus secrets.yaml. 5 Fehlversuche
# je Adresse in 15 min sperren diese Adresse fuer 15 min. Nach dem Login bleibt man angemeldet
# (Sitzungs-Token im Flash, uebersteht Updates).
#
# Braucht die Pakete wem-schalten und warmwasser-schalten (Schaltbefehle laufen wie per MQTT durch
# Warteschlange, Sperrminute und Kontrolle am Bus). Zusatzanzeigen (Paket zusatz): das Board
# abonniert die Topics der Liste selbst, sobald MQTT verbunden ist.
#
# Von aussen: nur ueber einen Reverse Proxy mit HTTPS (das Board kann kein HTTPS).
# Die Docker-App (app/) laeuft unabhaengig davon weiter, wenn man sie nutzt.

weishaupt_can:
  app:
    benutzer: !secret app_benutzer
    passwort: !secret app_passwort
    admin_passwort: !secret web_password   # Einstellungsseite und Weboberflaeche (ab v39)
    proxy: !secret app_proxy               # IP des Reverse Proxys oder "" (ab v42, Login-Sperre hinter Proxy)
    firmware: ${firmware}

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(wcan)->app->befehl = [](int ziel, const std::string &nutzlast) {
            id(befehl_eingang)->execute(ziel, nutzlast, std::string("App"));
          };
          id(wcan)->app->lesen = []() { id(status_lesen)->execute(); };
          id(wcan)->app->werksreset = []() { id(app_werksreset).press(); };
          id(wcan)->app->experten = id(experten_oberflaeche);
          // WEM-Adresse (ab v42): eingetragene lesen, gefundene uebernehmen
          id(wcan)->app->wem_ip_lesen = []() { return id(wem_ip).state; };
          id(wcan)->app->wem_ip_setzen = [](const std::string &ip) { id(wem_ip).make_call().set_value(ip).perform(); };

# Werksreset (ab v41): loescht alle gespeicherten Einstellungen, Zaehler und Zugangsdaten und startet neu.
# Ausgeloest nur ueber die Einstellungsseite (mit Bestaetigung) - kein Knopf in der Weboberflaeche.
button:
  - platform: factory_reset
    id: app_werksreset
    name: "Werksreset"
    internal: true
