services:
  heizungsapp:
    build: .
    container_name: heizungsapp
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MQTT_URL: ${MQTT_URL}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      MQTT_GERAET: ${MQTT_GERAET:-weact-can485-weishaupt}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      BOARD_URL: ${BOARD_URL:-}
      ALARM_MAIL: ${ALARM_MAIL:-}   # optional: Mail bei >= 20 fehlgeschlagenen Logins am Tag (braucht sendmail)
      LOGIN_FEHL_MAX: ${LOGIN_FEHL_MAX:-5}        # Login-Schutz: Fehlversuche je IP ...
      LOGIN_FENSTER_MIN: ${LOGIN_FENSTER_MIN:-15} # ... in Minuten
      LOGIN_SPERRE_MIN: ${LOGIN_SPERRE_MIN:-15}   # dann Sperre in Minuten
      LOGIN_MAIL_AB: ${LOGIN_MAIL_AB:-20}         # Mail (ALARM_MAIL) ab so vielen Fehlversuchen am Tag
    volumes:
      - ./data:/data        # Anmelde-Tokens ueberleben einen Neubau
    mem_limit: 256m
