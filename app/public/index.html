<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>Heizung</title>
  <link rel="stylesheet" href="/style.css?v=__VERSION__">
</head>
<body>

  <!-- Login Overlay -->
  <div id="loginOverlay" class="login-overlay hidden">
    <div class="login-box">
      <div class="login-logo">⬡</div>
      <h2>HEIZUNG</h2>
      <p class="login-sub">Zugangsdaten eingeben</p>
      <input id="loginUser" type="text" placeholder="Benutzername" autocomplete="username">
      <input id="loginPass" type="password" placeholder="Passwort" autocomplete="current-password">
      <div id="loginError" class="login-error hidden">Falsche Zugangsdaten</div>
      <button id="loginBtn">EINLOGGEN</button>
    </div>
  </div>

  <main class="app">

    <header class="header">
      <div class="header-left">
        <span class="logo">⬡</span>
        <span class="header-title">WEISHAUPT</span>
      </div>
      <div class="header-right">
        <button id="installBtn" class="install-btn hidden">+ App</button>
        <span id="statusDot" class="status-dot"></span>
        <a id="boardBtn" class="board-btn hidden" href="#" target="_blank" rel="noopener" title="Board" aria-label="Weboberfläche des Boards">⚙</a>
        <button id="logoutBtn" class="logout-btn" title="Ausloggen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
            <line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
        </button>
      </div>
    </header>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

    <!-- Heizkreis: voll markiert = Ist (am Bus bestaetigt), gestrichelt = eigene Vorgabe noch nicht bestaetigt,
         rechts "Zustand" = Laufzustand aus den Statusbits -->
    <section class="block" id="hkBlock">
      <div class="block-head">
        <span class="block-title">HEIZKREIS</span>
        <span class="block-zustand">Zustand: <span id="hkZustand">—</span></span>
        <button id="statusLesenBtn" class="lesen-btn" type="button" title="Heizkreis- und Warmwasser-Betriebsart einmal vom Bus lesen" aria-label="Status lesen">↻</button>
      </div>
      <div id="modes" class="modes-grid"></div>
    </section>

    <!-- Warmwasser: voll markiert = Ist (am Bus), gestrichelt = eigene Vorgabe, "Zustand" = laedt gerade / keine Ladung -->
    <section class="block" id="wwBlock">
      <div class="block-head">
        <span class="block-title">WARMWASSER</span>
        <span class="block-wert"><span id="wwIst">--,-</span> °C <span class="block-zusatz">unten</span></span>
        <span class="block-zustand">Zustand: <span id="wwAktiv">—</span></span>
      </div>
      <div class="ww-grid">
        <button id="wwEin" class="mode-btn" type="button">EIN</button>
        <button id="wwAus" class="mode-btn" type="button">AUS</button>
      </div>
    </section>

    <!-- Kessel und Aussen: im Hochformat untereinander, auf quadratischen/breiten Bildschirmen nebeneinander -->
    <div class="reihe">
    <!-- Kessel mit Brenner -->
    <section class="block" id="kesselBlock">
      <div class="block-head">
        <span class="block-title">KESSEL</span>
        <span class="block-zustand brenner" id="brennerZeile">Brenner: <span id="brennerText">—</span></span>
      </div>
      <div class="kessel-zeile">
        <span class="kessel-wert"><span id="kesselTemp">--,-</span><span class="einheit">°C</span></span>
        <span class="kessel-detail">Vorlauf <span id="vorlaufIst">--,-</span> / Soll <span id="vorlaufSoll">--,-</span><br>Rücklauf <span id="ruecklaufTemp">--,-</span></span>
      </div>
    </section>

    <!-- Aussentemperatur gross -->
    <section class="block aussen">
      <div class="block-head"><span class="block-title">AUSSEN</span></div>
      <div class="aussen-wert"><span id="outsideTemp">--,-</span><span class="einheit">°C</span></div>
    </section>
    </div>

    <div id="message" class="message"></div>
    <div class="app-version" id="appVersion">v__VERSION__</div>

  </main>

  <script src="/app.js?v=__VERSION__"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.update(); // sofort auf neue Version prüfen
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; window.location.reload(); }
      });
    }
  </script>
</body>
</html>
