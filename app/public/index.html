<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>Heizung</title>
  <link rel="stylesheet" href="/style.css?v=__VERSION__">
</head>
<body>

  <!-- Login Overlay -->
  <div id="loginOverlay" class="login-overlay hidden">
    <div class="login-box">
      <div class="login-logo">⬡</div>
      <h2>HEIZUNG</h2>
      <p class="login-sub">Zugangsdaten eingeben</p>
      <input id="loginUser" type="text" placeholder="Benutzername" autocomplete="username">
      <input id="loginPass" type="password" placeholder="Passwort" autocomplete="current-password">
      <div id="loginError" class="login-error hidden">Falsche Zugangsdaten</div>
      <button id="loginBtn">EINLOGGEN</button>
    </div>
  </div>

  <main class="app">

    <header class="header">
      <div class="header-left">
        <span class="logo">⬡</span>
        <span class="header-title">WEISHAUPT</span>
      </div>
      <div class="header-right">
        <button id="installBtn" class="install-btn hidden">+ App</button>
        <span id="statusDot" class="status-dot"></span>
        <button id="logoutBtn" class="logout-btn" title="Ausloggen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
            <line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
        </button>
      </div>
    </header>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

    <section class="readings">

      <div class="brenner-bar" id="brennerBar">
        <span class="brenner-icon">◉</span>
        <span id="brennerLabel">BRENNER — </span>
        <div class="mode-badges">
          <span class="mode-badge-label">VORGABE</span><span id="modeBadge" class="mode-badge">—</span>
          <span class="mode-badge-label">IST</span><span id="modeAktuell" class="mode-badge">—</span>
        </div>
      </div>

    </section>

    <section class="modes-section">
      <div class="modes-title">BETRIEBSART</div>
      <div id="modes" class="modes-grid"></div>
    </section>

    <section class="ww-section">
      <div class="ww-bar">
        <span class="ww-label" title="Warmwasser">WW</span>
        <span class="ww-werte"><span id="wwIst">--,-</span>°</span>
        <span class="ww-btns">
          <button id="wwEin" class="ww-btn" type="button">EIN</button>
          <button id="wwAus" class="ww-btn" type="button">AUS</button>
        </span>
        <span class="mode-badges">
          <span class="mode-badge-label">VORGABE</span><span id="wwVorgabe" class="mode-badge">—</span>
          <span class="mode-badge-label">IST</span><span id="wwAktiv" class="mode-badge">—</span>
        </span>
      </div>
    </section>

    <section class="readings">

      <div class="reading-card primary">
        <div class="reading-label">AUSSENTEMPERATUR</div>
        <div class="reading-value-row"><div class="reading-value" id="outsideTemp">--,-</div><div class="reading-unit">°C</div></div>
      </div>

      <button id="detailsToggle" class="details-toggle">▼ Details</button>

      <div id="detailsSection" class="details-section collapsed">
        <div class="reading-row">
          <div class="reading-card">
            <div class="reading-label">KESSEL</div>
            <div class="reading-value-row"><div class="reading-value small" id="kesselTemp">--,-</div><div class="reading-unit">°C</div></div>
          </div>
          <div class="reading-card">
            <div class="reading-label">RÜCKLAUF</div>
            <div class="reading-value-row"><div class="reading-value small" id="ruecklaufTemp">--,-</div><div class="reading-unit">°C</div></div>
          </div>
          <div class="reading-card">
            <div class="reading-label">VORLAUF IST</div>
            <div class="reading-value-row"><div class="reading-value small" id="vorlaufIst">--,-</div><div class="reading-unit">°C</div></div>
          </div>
          <div class="reading-card">
            <div class="reading-label">VORLAUF SOLL</div>
            <div class="reading-value-row"><div class="reading-value small" id="vorlaufSoll">--,-</div><div class="reading-unit">°C</div></div>
          </div>
        </div>
      </div>

    </section>


    <div id="message" class="message"></div>
    <div class="app-version" id="appVersion">v__VERSION__</div>

  </main>

  <script src="/app.js?v=__VERSION__"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.update(); // sofort auf neue Version prüfen
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; window.location.reload(); }
      });
    }
  </script>
</body>
</html>
